<style>
:root{--bg:#0b1220;--bg2:#121b2e;--card:#17233a;--line:#2a3b5c;--gold:#c9a227;--gold2:#e8c547;--text:#eef3ff;--muted:#9aa8c2;--good:#3dd68c;--bad:#ff6b7a;--safe:env(safe-area-inset-bottom,12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:16px 16px 110px;min-height:100dvh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.badgeimg{width:40px;height:40px;border-radius:10px;border:1px solid var(--gold);background:linear-gradient(160deg,#e8c547,#9a7a18);color:#0b1220;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:-.5px;flex:0 0 40px}
h1{font-size:1.15rem;margin:0}
.sub,.small{color:var(--muted);font-size:.8rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 6px;font-size:.95rem}
.card p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.35}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--gold);color:#14120a;font-weight:700}
.btn.sec{background:var(--bg2);color:var(--text);border:1px solid var(--line)}
.choice{width:100%;text-align:left;margin:0 0 8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}
.choice.good{border-color:var(--good);background:#123326}
.choice.bad{border-color:var(--bad);background:#3a1820}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(11,18,32,.94);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px var(--safe)}
.nav button{background:none;border:0;color:var(--muted);font-size:.65rem;min-width:56px;padding:6px 4px}
.nav button.on{color:var(--gold2)}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:.75rem;color:var(--muted)}
.pill.live{border-color:var(--gold);color:var(--gold2)}
.warnbox{background:#2a220e;border:1px solid #6b5420;border-radius:12px;padding:12px;color:#f3e2a8;font-size:.82rem;line-height:1.4;margin:10px 0}
.ref{background:#10182a;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 14px;color:#c9d6f0;font-size:.82rem;line-height:1.4}.qbox{font-size:1.05rem;line-height:1.45;margin:8px 0 16px}
.explain{background:#102018;border:1px solid #245c3d;border-radius:12px;padding:12px;margin:10px 0;color:#c8f3d8;font-size:.9rem}
.statrow{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.15rem;color:var(--gold2)}
.stat span{font-size:.7rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hero{padding:8px 0 4px}
.kicker{letter-spacing:.18em;font-size:.68rem;color:var(--gold);font-weight:700;margin:0 0 6px}
.hero h1{font-size:2rem;line-height:1.1;margin:0 0 8px}
.lead{color:var(--muted);font-size:.95rem;line-height:1.4;max-width:22rem}
.examrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 8px}
.exam{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:left}
.exam.on{border-color:var(--gold)}
.exam b{display:block;font-size:.9rem}
.exam span{display:block;color:var(--muted);font-size:.72rem;margin-top:4px}
.exam.on span{color:var(--gold2)}
.sec-label{letter-spacing:.16em;font-size:.65rem;color:var(--muted);margin:16px 0 8px}

</style>
</head>

ual).","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"uof","q":"An officer present who believes force is beyond that which is necessary shall:","ch":["Ask the suspect if they want to complain first","Counsel the partner after watch with no record","Stay off the radio so FID gets a clean scene","Intercede when safe and reasonable, report to a superior, and record if equipped with BWV"],"a":3,"ex":"Duty to intercede / report.","src":"Department Use of Force policy — duty to intercede/report; SO23 12-02-21 / current Manual. Confirm wording.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"uof","q":"After a TASER, suspect is handcuffed, seated, only yelling. You:","ch":["Wait to classify until the next SBA","Confirm medical, lock BWV/DICVS, classify the force under current policy, start required investigation/notifications","Have the involved officer write the whole package first","Clear as force already explained if they are talking"],"a":1,"ex":"Scene, medical, video, correct box.","src":"Department Use of Force policy and UOF investigation/review rules (SO23 12-02-21; SO6 02-07-23).","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"uof","q":"Crowd-control kinetic-energy projectiles or chemical agents were used. Besides tactics you must:","ch":["Have FID handle even a single stingball with no other force","Treat munitions as non-reportable if no one was struck in the head","Complete the crowd-control UOF reporting path required by the listed 2024 SO / current Manual","Only write a 15.7 if a council office calls"],"a":2,"ex":"SO5 11-05-24 reporting cluster.","src":"SO5 11-05-24 — reporting crowd-control force with kinetic-energy projectiles or chemical agents.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"uof","q":"SO25 exists so a WC will:","ch":["Prevent dangerous restraint positions, get medical, and follow current hobble/transport rules","Treat I can't breathe as stalling unless there is visible trauma","Hog-tie every combative prisoner for the jail ride","Leave a prone prisoner unattended if they are still talking"],"a":0,"ex":"Medical + position + transport.","src":"SO25 12-14-21 — positional asphyxia, hobble restraint, transporting injured suspects.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"uof","q":"Categorical vs non-categorical force got more serious after a hospital update. You:","ch":["Reclassify and notify per current levels-of-review rules","Wait for the SBA cycle","Ask the officer if they mind a bump","Keep the old box to avoid work"],"a":0,"ex":"SO6 / SO3 cluster.","src":"SO6 02-07-23 — use-of-force levels of review and investigative responsibilities.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"pobor","q":"POBOR is found in:","ch":["Manual Volume 1 only","Government Code 3300–3313","Penal Code 832","Evidence Code 1040"],"a":1,"ex":"GC 3300 et seq.","src":"California Government Code §§ 3300–3313 (Public Safety Officers Procedural Bill of Rights).","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"pobor","q":"During a punitive interrogation the officer generally must be informed of:","ch":["The nature of the investigation prior to interrogation, and may have a representative present","The recommended penalty before any questions","Only the complaint number after the statement is signed","Nothing if the WC calls it a chat"],"a":0,"ex":"GC 3303.","src":"Government Code § 3303 — interrogations; 2026 LT bibliography, POBOR.","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"pobor","q":"The one-year POBOR investigation clock generally runs from:","ch":["The date the Board of Rights is calendared","The next SBA due date","The date of hire","Discovery of the misconduct, subject to statutory exceptions in 3304(d)"],"a":3,"ex":"Lieutenants own clocks.","src":"Government Code § 3304(d) — one-year investigation limitations period and listed exceptions.","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"pobor","q":"A statement compelled under threat of job loss. Garrity generally means:","ch":["The statement is a criminal confession once written","You may skip representation","POBOR no longer applies","The compelled statement cannot be used in a criminal prosecution"],"a":3,"ex":"Garrity v. New Jersey.","src":"Garrity v. New Jersey, 385 U.S. 493 (1967); pair with Lybarger advisement on compelled statements.","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"pobor","q":"Locker search without consent, absent a recognized exception, generally needs:","ch":["Nothing if the locker is inside the station","A warrant, the officer present, or notice as GC 3309 provides","Only the watch commander's radio okay","Any supervisor hunch that Department property has no privacy"],"a":1,"ex":"GC 3309.","src":"Government Code § 3309 — search of lockers and other assigned storage spaces.","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"pobor","q":"Adverse comments going into a personnel file generally require:","ch":["Immediate termination paperwork","An opportunity to read and sign, and a written response right (GC 3305–3306)","No notice if a captain wrote it","Only verbal counseling with no paper"],"a":1,"ex":"3305-3306.","src":"Government Code §§ 3305–3306 — adverse comments in personnel files; right to respond.","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"pobor","q":"PSB wants an interview tomorrow and does not want POBOR to slow it down. You:","ch":["Tell the officer to refuse all questions and go home","Protect notice of the nature of the investigation, representation, recording rules, and Garrity/Lybarger if it is compelled","Have the officer write a criminal confession on a blank 15.7","Order the officer in with no representative because they said it is just a witness"],"a":1,"ex":"Process is the job.","src":"Government Code § 3303 (interrogation rules) and Garrity/Lybarger if the statement is compelled.","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"ops","q":"Stolen-vehicle pursuit, 8 minutes, 80 mph on surface streets, no further crime. WC should:","ch":["Add units until the car stops because property crime always justifies it","Wait for a collision before you can terminate","Stay off the air so the field sergeant owns it","Take or confirm command, apply the balance test, and terminate if risk outweighs need"],"a":3,"ex":"WC can terminate from the office.","src":"SO5 07-01-25 (pursuit initiation / air) and SO6 12-09-25 (DICVS / tracking a pursuit); current Manual pursuit policy.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"Officers following a clearly fleeing violator without calling a pursuit:","ch":["Is preferred because it avoids paperwork","Is not a substitute for initiating a pursuit under listed policy language","Is required until air arrives","Converts automatically to a traffic stop"],"a":1,"ex":"Do not use following as a substitute.","src":"Current Department pursuit policy (SO5 07-01-25 cluster) — following is not a substitute for a pursuit.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"Command of a pursuit transfers to another Area WC. You must:","ch":["Notify Communications, involved units, and any air unit of the transfer","Assume they heard it on the tac","Keep both WCs silently in command","Only note it after the pursuit report"],"a":0,"ex":"Clear command or you get two ICs.","src":"Current Manual pursuit policy — transfer of command; notify Communications, units, and air. (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Missing 9-year-old at dusk. First-hour standard is:","ch":["Treat as an emergency: resources, search, notifications, and public-alert rules as they apply","Take a desk report for day watch","Wait 24 hours because kids run away","Only broadcast if a parent demands it"],"a":0,"ex":"Missing-person SO + alerts.","src":"SO7 03-09-21 — missing and found persons; SO23 12-28-23 — public-alert initiation as applicable.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"School bomb threat / targeted violence. You:","ch":["Tweet a shelter-in-place from the Area account","Leave it to school police exclusively with no LAPD IC","Send one unit Code 2 and clear if the office thinks it is a prank","Follow the listed school-threat SO: notifications, campus protocol, do not freelance tactics"],"a":3,"ex":"SO22 cluster.","src":"SO22 12-27-23 — bomb threats at schools and threatened targeted mass violence.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"DICVS did not record a pursuit. You:","ch":["Close with no video, no pursuit","Erase remaining video so the package is consistent","Blame Communications and skip the report","Treat it as equipment/policy/performance, still complete pursuit documentation, preserve what exists"],"a":3,"ex":"SO6 12-09-25 + pursuit package.","src":"SO6 12-09-25 — DICVS use and tracking a pursuit.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"Impound because the driver was rude. You:","ch":["Skip inventory if the driver is present","Approve it to back the officer","Require a lawful community-caretaking or statutory basis under current SO/Manual","Always 30-day hold for attitude"],"a":2,"ex":"SO14.","src":"SO14 07-30-21 — Community Caretaking Doctrine and vehicle impound procedures.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"Hate / prejudice incident reporting (SO7 12-16-25). WC standard is:","ch":["Proper classification, required reporting, resource pamphlet, notifications — not just a 415","Treat speech you dislike as the crime without elements","Only take it if a detective is on duty","Close as advice given if nobody wants a report"],"a":0,"ex":"Classification + pamphlet.","src":"SO7 12-16-25 — reporting incidents motivated by hatred or prejudice.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"sUAS request on a search. You:","ch":["Skip logging if the search is short","Use the approved program path and log under the listed SO — not a private drone","Have an officer launch a personal drone off the hood","Deny all air because ICS hates robots"],"a":1,"ex":"SO4 06-24-25.","src":"SO4 06-24-25 — Small Unmanned Aerial System program deployment guidelines.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"High-risk stop based solely on belief a car might be stolen, no other facts. You:","ch":["Skip air and a supervisor because speed matters more","Turn BWV off until the car is empty","Do not treat a hunch as a high-risk felony stop; need current legal/tactical basis","Always gunpoint every possible 10851"],"a":2,"ex":"08-16-24 bibliography item.","src":"2026 LT bibliography field-operations item on high-risk vehicle stops; current Manual / 4th Amendment. (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"con","q":"Miranda attaches when both exist:","ch":["A traffic stop and a name check","Any field interview and a notebook","Custody and interrogation","An audience and a camera"],"a":2,"ex":"Both prongs.","src":"Miranda v. Arizona, 384 U.S. 436 (1966); SO1 01-14-21 (Miranda / WIC 625 cluster).","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"con","q":"A juvenile in custody is being questioned about a crime. Check:","ch":["Nothing if a parent is on the way tomorrow","Miranda plus current WIC 625 juvenile advisement rules","Only the booking number","Adult Miranda only; kids have no extra advisement"],"a":1,"ex":"SO1 / SO2 WIC 625 cluster.","src":"SO1 01-14-21 and SO2 06-11-24 — Miranda plus WIC § 625 juvenile advisement.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"con","q":"Terry frisk requires reasonable suspicion the person is:","ch":["Armed and dangerous","In a high-crime area only","On probation","Rude during the stop"],"a":0,"ex":"Separate stop from frisk.","src":"Terry v. Ohio, 392 U.S. 1 (1968) — stop versus frisk.","url":"https://supreme.justia.com/cases/federal/us/490/386/"},{"topic":"con","q":"Pretext-stop limitations are on the bibliography so you:","ch":["Order BWV off to reset the stop","Apply current Department limits, not old any-equipment-violation folklore","Treat every tint stop as a narcotics investigation automatically","Ignore SO3 because traffic always justifies a full search"],"a":1,"ex":"SO3 03-09-22.","src":"SO3 03-09-22 — limitation on the use of pretextual stops.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"con","q":"A traffic stop is a seizure under which amendment?","ch":["Second","Tenth","Fourth","First"],"a":2,"ex":"Stops, detentions, arrests, most force.","src":"Fourth Amendment; Whren / Rodriguez line; Department stop policy.","url":"https://supreme.justia.com/cases/federal/us/490/386/"},{"topic":"con","q":"Lawful public recording of police should generally be:","ch":["A felony if they cuss","Allowed; do not retaliate or seize as punishment","Automatic grounds for detention","Stopped by spraying the camera"],"a":1,"ex":"First Amendment / civil unrest video cluster.","src":"First Amendment; SO2 01-12-23 civil-unrest / videographer cluster; current Manual.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"sup","q":"VWE supervisory capacity means:","ch":["Full-time line responsibility: assign work, review work, and complete rating reports","Writing a single 15.7 about another squad","Being senior at one crime scene","Having a radio and a stripe"],"a":0,"ex":"Personnel definition on the form.","src":"City of Los Angeles Personnel / VWE instructions — definition of supervisory capacity.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"sup","q":"Employee reports sexual harassment by a popular supervisor. You:","ch":["Investigate off the books and keep no paper","Receive it, protect from retaliation, route per EEO/complaint policy, notify command","Tell them not to ruin a career over a joke","Confront the accused at roll call for sport"],"a":1,"ex":"Retaliation SO / EEO.","src":"SO9 05-22-12 — policy prohibiting retaliation; Department EEO / complaint procedures.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"sup","q":"Best sergeant is exploding overtime with unplanned holds. You:","ch":["Ignore MOU/fatigue issues until a grievance lands","Get the numbers, reset expectations, plan staffing, document, brief the captain","Keep holding silently to make the board","Blame the officers for having kids"],"a":1,"ex":"Supervision + MOU.","src":"MOU 24 (or current LAPPL MOU) plus Department overtime / fatigue and supervision standards.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"sup","q":"SBA is primarily used to:","ch":["Hide misconduct until the rating year ends","Replace all 1.28 investigations","Pay only","Document performance against standards, develop people, and support personnel decisions"],"a":3,"ex":"Performance system.","src":"Department Standards Based Assessment / performance evaluation system — Manual / Personnel rules.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"sup","q":"BWV/DICVS supervisory review means a lieutenant:","ch":["Audits video for policy, tactics, and professionalism — not hope","Deletes video that is inconvenient","Only watches video after a lawsuit","Lets officers self-certify activation"],"a":0,"ex":"Supervisory review notice.","src":"SO6 12-09-25 — DICVS use and tracking a pursuit.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ics","q":"Span of control is generally:","ch":["Two chiefs per officer","Unlimited if you have a cell phone","1:20 on civil unrest because everyone can hear the tac","About 3–7 subordinates, optimally near 5; branch if it breaks"],"a":3,"ex":"ICS.","src":"ICS / NIMS — FEMA ICS-100/200; 2026 LT bibliography incident-command knowledge area.","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"ics","q":"You arrive at a growing incident. First:","ch":["Get a briefing and either assume command cleanly or support the current IC","Wait for the captain before any radio","Create a second silent command from your car","Run to the most exciting corner"],"a":0,"ex":"Arrival ritual.","src":"ICS / NIMS transfer/assumption of command; 2026 LT bibliography.","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"ics","q":"Unified Command is for:","ch":["Any time a sergeant wants a second radio","Only when the mayor arrives","Replacing ICS functions with a press conference","More than one agency/jurisdiction with significant authority at the same incident"],"a":3,"ex":"ICS/NIMS.","src":"ICS / NIMS — Unified Command when more than one agency has significant authority.","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"pj","q":"Four pillars of procedural justice:","ch":["Speed, stats, arrests, overtime","Rank, time, power, silence","Force, numbers, media, fear","Voice, neutrality, respect, trustworthiness"],"a":3,"ex":"Bulletin knowledge area.","src":"2026 Lieutenant bulletin knowledge area — procedural justice (voice, neutrality, respect, trustworthiness).","url":"https://www.lapdonline.org/community-inquiries-on-lapd-training-and-practice/"},{"topic":"pj","q":"A pattern of stops that looks like pretext fishing. You:","ch":["Wait for Inspector General","Tell them to turn BWV off on the next one","Apply current pretext limits, audit BWV, coach or complaint as the facts require","Praise the numbers only"],"a":2,"ex":"Biased policing + pretext SOs.","src":"SO3 03-09-22 — limitation on the use of pretextual stops.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"mou","q":"A grievance hits the WC desk. Best first move:","ch":["Follow contractual steps and timelines; try to resolve at the lowest appropriate level; document","Send it to the Chief the same night skipping steps","Tear it up as insubordination","Ignore it until it disappears"],"a":0,"ex":"MOU 24 process competence.","src":"Current LAPPL MOU grievance procedure (MOU 24 or successor) — lowest appropriate level and timelines.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"mou","q":"Secondary employment while on sick/IOD/TTD is:","ch":["Encouraged to keep them busy","A private matter you never document","Always fine if they use a different name","Restricted by listed 2023 SOs; supervisors must know and act"],"a":3,"ex":"SO8/SO13.","src":"SO8 / SO13 2023 — secondary employment and strenuous activity while sick, IOD, or TTD.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"crime","q":"Last period 80 burglaries, this period 100. Percent change is:","ch":["80% increase because 80 was last period","25% increase","20% increase (raw count change treated as percent)","20 percentage points, therefore 20%"],"a":1,"ex":"(100-80)/80 = 25%.","src":"Crime-analysis percent change: (new − old) / old. 2026 LT exam quantitative / crime-stats area.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"Air unit is up and the ground unit is still calling a stolen for a 15-minute surface pursuit with no further crime. Best WC move:","ch":["Apply the balance test and terminate if risk outweighs need even if air is up","Stay off the air so air owns command","Add spike strips on every block automatically","Keep it going because air is now covering liability"],"a":0,"ex":"Air does not cancel the balance test.","src":"SO5 07-01-25 and current Manual pursuit policy — air does not cancel the balance test.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"ops","q":"Two sergeants are both giving pursuit orders on different tacs. You:","ch":["Let both keep talking so nobody feels overruled","Wait until the car stops","Establish one IC, announce command, kill the dual-command problem","Tell Communications to ignore both"],"a":2,"ex":"One IC.","src":"Current Manual pursuit / ICS command policy — one incident commander. (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"uof","q":"Hobble is on and the suspect is face-down in the back seat complaining they cannot breathe. You:","ch":["Leave them prone until jail","Sit them up or use an approved position, get medical, follow SO25 / current Manual","Remove the hobble and release them on the sidewalk","Tell them they are lying because they can talk"],"a":1,"ex":"Position + medical.","src":"SO25 12-14-21 — positional asphyxia, hobble restraint, transporting injured suspects.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"pobor","q":"Officer asks for a representative and the investigator says we do not have time. You:","ch":["Cancel the whole investigation","Order the officer to answer now or be insubordinate","Have the sergeant sit in as the representative automatically","Stop and honor representation rules before the punitive interview continues"],"a":3,"ex":"GC 3303 representation.","src":"Government Code § 3303 — right to a representative during a punitive interrogation.","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{" al response?","ch":["Containment","Control","Command","Communications","Coordinate"],"a":4,"ex":"The four C’s are Containment, Control, Command, and Communications.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"You respond to a bomb-threat radio call and a possible device is found. How far do you evacuate the surrounding area?","ch":["500 feet","400 feet","300 feet","200 feet"],"a":2,"ex":"Evacuate 300 feet.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"At a bomb-threat radio call, who determines if a search is to be conducted?","ch":["Person in charge of the location","Senior officer","Watch Commander","Bomb Squad Supervisor"],"a":0,"ex":"Person in charge of the location decides whether to search.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"If a device is found at a location, who has responsibility to evacuate that location?","ch":["Person in charge of the location","Senior officer","Watch Commander","Bomb Squad Supervisor"],"a":0,"ex":"Person in charge of the location.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Are media members allowed to enter a bomb scene area?","ch":["Yes","No"],"a":1,"ex":"No.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Which is NOT a Crowd Management objective?","ch":["Establish contact with the crowd and the formal leader","Obtain voluntary compliance with police directives","Minimize enforcement actions","Arrest violators"],"a":3,"ex":"Arresting violators is a crowd-control, not crowd-management, objective.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"“Restore conditions to normal as rapidly and efficiently as possible” is the definition of the Department’s:","ch":["Crowd Management Mission","Crowd Control Mission","General Principles of Crowd Management","General Principles of Crowd Control"],"a":1,"ex":"That wording is the Crowd Control Mission.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Objectives that must be addressed to accomplish the crowd-control mission include all EXCEPT:","ch":["Protect life","Protect vital facilities","Arrest violators","Restore and maintain order","Establish contact with the crowd","Protect property"],"a":4,"ex":"Establish contact with the crowd is a management objective, not a control objective.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"All of the following are General Principles of Crowd Management EXCEPT:","ch":["Establish contact with the crowd","Control of personnel","Separate opposing factions","Gather intelligence","Knowledge of previous events","Contain and isolate","Alternate location of assembly"],"a":5,"ex":"Contain and isolate is a crowd-control principle.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"All of the following are General Principles of Crowd Control EXCEPT:","ch":["Rapid mobilization and deployment","Contain and isolate","Gather intelligence","Secure critical or sensitive locations","Disperse and discourage disorderly groups","Provide protection to City agencies or utilities","Return to normalcy"],"a":2,"ex":"Gather intelligence is a management principle.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"A damage assessment (windshield survey) must be provided to DOC or Bureau Command within how long after an earthquake?","ch":["30 minutes","One hour","Two hours","20 minutes"],"a":0,"ex":"30 minutes.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"On a General Survey Report the color Amber represents:","ch":["Little sign of apparent impact","Major problems in the Reporting District","Severe damage and life-threatening situations","Signs of impact to people and structures; impact appears minor"],"a":3,"ex":"Amber = signs of impact; impact appears minor.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"An evacuation warning should include all EXCEPT:","ch":["Type of evacuation (voluntary or mandatory)","Best available routes out of the area","Location of evacuation centers","Command post location","Anticipated duration of the emergency","Time remaining before the situation becomes critical"],"a":3,"ex":"Command post location is not part of the public warning list.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"At a fire the Police Incident Commander can establish a:","ch":["Law Branch within the Operations Section","Logistics Branch within the Operations Section","Safety Officer only","Communications Officer only"],"a":0,"ex":"Law Branch inside Operations.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Laboratories confirmed by hazmat technicians to be used solely for narcotics production will be investigated by:","ch":["NED","LA Impact","Hazardous Materials Unit","MCD"],"a":0,"ex":"NED.","src":"Field Operations Guide ( t radio call an officer shall turn off all radio transmission.","ch":["True","False"],"a":1,"ex":"False — do not automatically kill all radio.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"An officer can arrest a person for refusing to evacuate a bomb-threat scene under what authority?","ch":["148(a) PC","69 PC","409.5 PC","242 PC"],"a":2,"ex":"409.5 PC.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"It is Department policy to use crowd ______ strategies and tactics whenever possible to keep a lawful crowd from becoming an unlawful assembly or riot.","ch":["Management","Control"],"a":0,"ex":"Crowd management first.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Which is NOT an Area Watch Commander responsibility during an earthquake?","ch":["Conduct roll call of on-duty personnel","Start a log","Go out in the neighborhood and obtain a damage assessment","Telephonically survey or dispatch personnel to report damage to critical infrastructure","Instruct Area personnel to report damage to the station"],"a":2,"ex":"The WC does not personally go out to do the windshield survey as the listed duty.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"If a letter with unknown materials or suspected biological pathogens is discovered outdoors, isolate _____ feet in all directions.","ch":["50","100","150","200"],"a":1,"ex":"100 feet.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"At a homicide scene the first officer shall allow which of the following Department personnel into the crime sce ng is not mandatory for Department-initiated minor misconduct such as FTA, FTQ, and PTC.","src":"Manual 3/810.05 Exception (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Which of the following are considered high-grade misdemeanors?","ch":["Indecent exposure","Child molesting","Contributing","Petty theft","Lewd conduct","All of the above"],"a":5,"ex":"All listed items are high-grade misdemeanors.","src":"Manual 3/837.10 Note (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Non-Disciplinary complaints require a Letter of Transmittal.","ch":["True","False"],"a":1,"ex":"False. Non-Disciplinary complaints do not require a LOT.","src":"Manual 3/831.10 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Who must an employee notify when obtaining an EPO for workplace violence involving a City employee as the protected person?","ch":["Legal Affairs Unit","Robbery-Homicide Division","Internal Affairs Group","Threat Management Unit, DSVD","None of the above"],"a":3,"ex":"TMU, Detective Support and Vice Division.","src":"Manual 3/891 Note (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Who should a supervisor contact for advice before releasing legally protected or intelligence information to the Office of the Inspector General?","ch":["The Area CO","The Bureau CO","Internal Affairs Group","Legal Affairs","Chief of Staff"],"a":4,"ex":"Chief of Staff.","src":"Manual 3/895 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Who is responsible for auditing the Department e-mail system?","ch":["Internal Affairs Group, Special Operations Division","Audit Division","Office of the Inspector General","Communications Division"],"a":1," Who takes command of an emergency"],"a":1,"ex":"Staff Officer = above captain.","src":"Manual 3/105 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"When the Office of the Chief of Police is closed, the Department Command Post is:","ch":["DOC","Communications Division","RACR","The Area watch commander"],"a":2,"ex":"RACR.","src":"Manual 3/108.20 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"The senior officer at a police incident is determined by:","ch":["Time on scene, then rank","Rank, then paygrade within rank, then seniority within paygrade","Detective status first","Who requested the call"],"a":1,"ex":"Rank, then paygrade, then seniority. Detectives are normally separate from line command.","src":"Manual 3/125 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Supervisors may delegate portions of their duties and equivalent authority, but they may not delegate:","ch":["Training","Overall responsibility for results or any portion of their accountability","Roll-call inspection","FI review"],"a":1,"ex":"Accountability stays with the supervisor.","src":"Manual 3/154.20 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Negative discipline shall be used only after determining that correction by positive disciplinary means is:","ch":["Too slow","Not feasible","Requested by the employee","Directed by IAG"],"a":1,"ex":"Manual 3/156.80.","src":"Manual 3/156.80 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Pursuit-related reports go to the bureau commanding officer within:","ch":["10 calendar days","14 calendar days","20 calendar days","30 calendar days"],"a":2,"ex":"20 calendar days of the pursuit.","src":"Manual 3/201.05 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"When training is directed after a pursuit, the Area/division CO shall ensure it is completed within:","ch":["30 days","60 days","90 calendar days","One DP"],"a":2,"ex":"90 calendar days.","src":"Manual 3/201.25 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Fleet-safety points remain countable for:","ch":["12 months","24 months","36 months","The employee’s career"],"a":2,"ex":"36 months from the date of the accident.","src":"Manual 3/207.95 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Level One / Two / Three preventable collision points are:","ch":["1 / 2 / 3","1 / 2 / 4","2 / 3 / 4","1 / 3 / 5"],"a":1,"ex":"1, 2, and 4 points.","src":"Manual 3/207.95 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Three points in 24 months requires:","ch":["No driving for 6 months","Formal standardized driver-improvement training by Training Division","Administrative transfer","A 1.28"],"a":1,"ex":"Formal driver-improvement training; it does not reduce the point count.","src":"Manual 3/207.95 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Five points in 36 months means the employee shall not drive a City vehicle for:","ch":["30 days","90 days","Six months","One year"],"a":2,"ex":"Six months.","src":"Manual 3/207.95 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Eight or more points or four preventable accidents in 36 months results in:","ch":["Counseling only","Administrative transfer and no City driving / no return to the division left for one year","Termination","Loss of POST"],"a":1,"ex":"Admin transfer; no driving and no return for one year. COP retains final transfer authority.","src":"Manual 3/207.95 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Watch Commanders may start 15 minutes early to prepare for roll call. Extra time requires:","ch":["No approval","Immediate supervisor approval only","Commanding officer approval","Bureau approval"],"a":2,"ex":"Any additional time requires CO approval.","src":"Manual 3/222.20 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"The watch commander shall remain present during:","ch":["The first five minutes of roll call","The entire roll call period","Inspection only","Dismissal only"],"a":1,"ex":"Entire roll call.","src":"Manual 3/222.30 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Area/division/Department orders that might affect the watch shall be read at roll call for:","ch":["One day","Three consecutive days","Five consecutive days","One DP"],"a":2,"ex":"Five consecutive days. Note watch, reader name/serial, and date on the face of the order.","src":"Manual 3/222.45 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"When a watch commander will be absent, he or she shall:","ch":["Leave the desk officer in charge automatically","Designate a qualified subordinate to assume WC duties","Notify RACR only","Close the watch"],"a":1,"ex":"Manual 3/230.95.","src":"Manual 3/230.95 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"ICS shall be the primary incident-management tool utilized by the Department.","ch":["True","False"],"a":0,"ex":"True.","src":"EOG Vol. 4 Command Officer’s Guide","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"man","q":"ICS priorities, in order, are:","ch":["Property, life, stabilization","Life safety, incident stabilization, property preservation","Arrest, evidence, press","Containment, control, command"],"a":1,"ex":"Life, then stabilize, then property.","src":"EOG Vol. 4 / ICS","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"man","q":"The five major ICS functional areas (COPLA) are:","ch":["Command, Operations, Planning, Logistics, Administration/Finance","Containment, Operations, Patrol, Logistics, Air","Command, Operations, Press, Legal, Admin","Control, Ops, Planning, Law, After-action"],"a":0,"ex":"COPLA.","src":"EOG Vol. 4","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"man","q":"ICS span of control of any supervisor should range from:","ch":["Two to four","Three to seven","Five to ten","One to three"],"a":1,"ex":"Three to seven.","src":"EOG Vol. 4 — Essential Features of ICS","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"man","q":"Incidents are spontaneous; events are:","ch":["Always larger","Pre-planned","Always multi-agency","Always declared unusual occurrences"],"a":1,"ex":"EOG Vol. 4.","src":"EOG Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Who investigates Categorical Uses of Force?","ch":["Area CO","FID","UOF Review Division only","The Watch Commander"],"a":1,"ex":"Force Investigation Division investigates all aspects of CUOF, with listed exceptions.","src":"Manual 3/794.10 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"FID shall complete a CUOF In-Custody Death investigation unless ALL of the listed natural-death conditions exist, including Coroner preliminary determination of natural/accidental/undetermined, no UOF, no misconduct, no policy violation that led to the death, tox supports Coroner, and no seriously conflicting statements.","ch":["True","False"],"a":0,"ex":"True — all conditions must exist to reclassify off the CUOF track.","src":"Manual 3/794.10 ICD (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"A suspect may be transported to a victim or witness for field ID when a preliminary investigation requires it AND probable cause exists, OR exigent circumstances make transporting the victim/witness unreasonable, OR the suspect consents.","ch":["True","False"],"a":0,"ex":"True. Also give the three advisements to the victim/witness.","src":"Manual 4/203.50 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Officers must handcuff a person with mental illness taken into custody when the person is not restrained by a straitjacket or restraining straps.","ch":["True","False"],"a":0,"ex":"True.","src":"Manual 4/217.36 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Uniformed personnel shall not maintain or use confidential informants. They shall contact a non-uniformed investigative employee as soon as practical.","ch":["True","False"],"a":0,"ex":"True.","src":"Detective Bureau Notices — confidential informants (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Critical missing adult includes suicidal, immediate medical need including Alzheimer’s/dementia, elderly who cannot care for themselves, or disappeared under unusual circumstances. Adults are handled by:","ch":["Area Juvenile Detectives","MPU, DSVD","FID","RACR only"],"a":1,"ex":"Missing Persons Unit, DSVD. Ping through MCD if there is a cell phone.","src":"Detective Bureau Notices — Critical Missing Adults (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Brevet (acting) ranks shall not be used. An officer assigned to a higher function shall be described by:","ch":["The acting title only","His or her Civil Service rank, indicating the acting position held","The paygrade of the vacant spot","Whatever Communications broadcasts"],"a":1,"ex":"Example: Lieutenant John Doe, Acting Commanding Officer.","src":"Manual 3/120 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Functional supervision is:","ch":["Permanent command of another unit","Temporary supervision of employees not normally under one’s command to furnish specialized or technical knowledge","The same as line supervision","Supervision only of civilians"],"a":1,"ex":"Temporary + specialized/technical knowledge.","src":"Manual 3/140 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"CTSOB has final review of all vehicle pursuits and may delegate in-policy, non-conflicting pursuits to:","ch":["Area CO","CO, EOD","IAG","Training Division"],"a":1,"ex":"CO EOD may take in-policy pursuits that do not conflict with bureau classification.","src":"Manual 3/201.15 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"CO, EOD shall make the final pursuit classification within how many calendar days of receipt?","ch":["14","20","30","90"],"a":2,"ex":"30 days, with an extra 30 if more investigation is documented in the file.","src":"Manual 3/201.20 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Citation books not completed within three months after issuance shall be:","ch":["Destroyed","Recalled and reissued to more enforcement-active employees","Kept by the original officer","Sent to Traffic Court"],"a":1,"ex":"90 days / three months.","src":"Manual 3/202.24 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"A Fleet Safety Peer Review Board reviews minor collisions involving lieutenants and below and shall consist of:","ch":["Three captains","Two members of equal Civil Service rank and a supervisor at least one rank above","Only Training Division","The Bureau CO only"],"a":1,"ex":"2 peers + 1 supervisor at least one rank above.","src":"Manual 3/207.10 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"The Executive Fleet Safety Committee reviews collisions involving LTs and below that result in:","ch":["Any property damage","A or K injuries","Parking hits only","Off-duty collisions only"],"a":1,"ex":"A or K injuries.","src":"Manual 3/207.30 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"An employee appealing a preventable T/C finding or point value shall submit a 15.7 to the Department Traffic Coordinator within:","ch":["10 calendar days","20 calendar days","30 calendar days","One DP"],"a":1,"ex":"One appeal per incident. Reviewing Officer decision is final.","src":"Manual 3/207.62 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Employees shall log on and acknowledge electronic subpoenas and cancellations at least:","ch":["Once per week","Once per workday","Once per DP","Only when SCO calls"],"a":1,"ex":"Once per workday. WC enforces it.","src":"Manual 3/210.02 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"The five discretionary watch assignment pools include Lieutenants I/Watch Commanders, Sergeant II/AWC, probationary Sergeant I, traffic trainees, and:","ch":["All Sergeant I","Police Officers I","Only detectives","SLOs"],"a":1,"ex":"PO I is the fifth discretionary pool.","src":"Manual 3/222.02 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Senior officers in each non-supervisory primary watch pool shall not exceed what percent of that pool?","ch":["4 percent","10 percent","15 percent","50 percent"],"a":2,"ex":"15 percent. Separately, PO II/III with 20+ years, not to exceed 4 percent of those ranks, get watch choice.","src":"Manual 3/222.02 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Watch seniority continues during sick, IOD, leave, and vacation, but does not accrue during military activation in excess of:","ch":["One day","One DP","30 days","One year"],"a":1,"ex":"More than one DP of military activation stops seniority accrual.","src":"Manual 3/222.02 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Primary-pool employees become eligible to be bumped after how many full consecutive DPs on the same watch?","ch":["3","6","9","12"],"a":1,"ex":"Six full consecutive DPs. Discretionary pools: three.","src":"Manual 3/222.02 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Deployment (DWS) shall be transmitted to Communications no later than:","ch":["Start of watch","15 minutes prior to clearance","30 minutes prior to clearance time","End of roll call"],"a":2,"ex":"30 minutes prior to clearance.","src":"Manual 3/224.10 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"A serious occupational injury/illness for OSHA purposes includes inpatient hospitalization over 24 hours (other than observation), loss of a body member, or serious permanent disfigurement. The Area WC must immediately notify RACR of an occupationally related death or life-threatening injury.","ch":["True","False"],"a":0,"ex":"True. Form 5020 to Medical Liaison within 24 hours.","src":"Manual 3/275.10 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Every worksite housing more than how many personnel must have a Building Emergency Coordinator and a disaster plan?","ch":["5","10","15","25"],"a":1,"ex":"More than 10.","src":"Manual 3/279 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Before releasing CORI, the employee must determine the requester’s:","ch":["Rank only","Right to know and need to know","Friendship with the subject","Press credential"],"a":1,"ex":"Right to know and need to know.","src":"Manual 3/408.16 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"uof","q":"Final administrative reports of OIS, ICD, upper-body control hold, UOF death, UOF hospitalization, head strike with an impact weapon, and K-9 bite with hospitalization shall be marked:","ch":["Public record","Confidential","Training only","CompStat"],"a":1,"ex":"CO FID retains original; copies to OIG, LAD, UOFRB.","src":"Manual 3/409.20 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"uof","q":"The 72-Hour Brief is:","ch":["The Board of Rights packet","The briefing for the COP and concerned command staff on preliminary CUOF information","The employee’s Skelly","The press release"],"a":1,"ex":"Manual 3/792.","src":"Manual 3/792 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"uof","q":"The COP shall submit CUOF recommended administrative findings to BOPC by the admin statute deadline, which is:","ch":["The one-year date","60 calendar days prior to the administrative statute date","30 days after FID closes","14 days after the 72-hour brief"],"a":1,"ex":"Statute is generally one year from report to a supervisor, unless tolled.","src":"Manual 3/792.06 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"pobor","q":"If an employee declines to waive Miranda and the administrative interview must continue, the investigator shall read the administrative admonition that silence can be deemed insubordination and that compelled statements cannot be used in a later criminal case.","ch":["True","False"],"a":0,"ex":"Lybarger / administrative admonition.","src":"Manual 3/820.15","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"ops","q":"A Code Five Edward notifies Air Support of an explosive hazard to low-altitude aircraft. Radio or MDT should be used about how far from the location?","ch":["50 feet","100 feet","One block / about 500 feet","One mile"],"a":2,"ex":"Also give CD the location and perimeter in feet.","src":"Manual 4/120.40 Code Five Edward (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"An officer may initiate Code Three when an emergency exists, including a serious public hazard, immediate pursuit, preservation of life, serious crime in progress, prevention of a serious crime, or another unit requested Code Three.","ch":["True","False"],"a":0,"ex":"Supervisors manage and can shut down extra Code Three after Code Four.","src":"Manual 4/120.40 Code Three (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Hearing-impaired calls from Communications must be contacted within:","ch":["15 minutes","30 minutes","One hour","End of watch"],"a":2,"ex":"Log on the STORM log. If you cannot finish in an hour, call back with an ETA.","src":"Manual 4 — hearing-impaired / STORM (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Officers shall obtain a DR number within two hours of determining that a Missing/Found Persons Investigation will be completed for any missing person.","ch":["True","False"],"a":0,"ex":"Also NCIC/DOJ within two hours. Under 21 entered as a juvenile.","src":"Manual 4/712 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"An Amber Alert requires confirmed abduction; victim 17 or younger or confirmed mental/physical disability; reasonably believed in imminent danger of SBI or death; and sufficient information that, if publicized, could help recovery.","ch":["True","False"],"a":0,"ex":"Not for runaways, missing-without-foul-play, or custody disputes that are not life-endangering. Request through RACR.","src":"Manual 4/712.20 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"A Blue Alert requires a LE officer killed, SBI, or assaulted with a deadly weapon; suspect fled; imminent threat; detailed vehicle or plate; and public info may help avert further harm. RHD notifies RACR; RACR requests through CHP.","ch":["True","False"],"a":0,"ex":"All conditions must be met.","src":"Manual 4/760.20 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Employees must never ask an arrestee or detainee about their legal status in the United States.","ch":["True","False"],"a":0,"ex":"Manual note on immigration status questions.","src":"Manual Vol. 4 note (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Narcotics-related currency that appears to exceed $10,000 shall not be disturbed or counted. Notify a lieutenant or acting WC and AFID.","ch":["True","False"],"a":0,"ex":"WC responds. Photograph in place. Extra copy of reports to Asset Forfeiture, GND.","src":"Manual 4/201.65 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Hate crime vs hatred incident: a hatred incident is non-criminal (epithets, posted material with no damage). A hate crime is a criminal act or attempt based on protected status. Complete an IR even if the victim will not sign.","ch":["True","False"],"a":0,"ex":"Notify WC and RACR; check Motivated by Hatred/Prejudice. WC sends copies to the Hate Crime Coordinator (Area Detective CO).","src":"Manual 4 — Hate Crime (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"A lieutenant or above shall be present at execution of search warrants where GED/CLEAR personnel are involved in the service.","ch":["True","False"],"a":0,"ex":"Supervisor at each location; lieutenant coordinates multi-location. Not required if GED is support-only.","src":"Manual 4/742.30 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"A supervisor shall be present for all warrant services that require a Tactical Plan Report. GPS-only or third-party records warrants do not require a Tactical Plan.","ch":["True","False"],"a":0,"ex":"Affiant shall not be the same supervisor who initials approval. Separate Tactical Plan per location.","src":"Manual 4/742 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"fog","q":"ICS transfer of command must include a briefing that captures essential information for continuing safe and effective operations.","ch":["True","False"],"a":0,"ex":"Establishment and Transfer of Command is an essential ICS feature.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Unity of command means every individual at the incident has:","ch":["Two bosses if Unified Command exists","One designated supervisor","No supervisor in the hot zone","Only radio contact with DOC"],"a":1,"ex":"One supervisor. Chain of command is the orderly line of authority.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Unified Command is used when multiple jurisdictions or agencies have significant authority so they can work together without losing individual agency authority.","ch":["True","False"],"a":0,"ex":"EOG Vol. 4.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"so","q":"SO3 03-09-22 limits pretextual stops. A stop justified only as a fishing expedition for an unrelated hunch is:","ch":["Always lawful if the tint is dark","In tension with current Department pretext policy","Required by CompStat","The same as a probation search"],"a":1,"ex":"Use current Manual / SO3 03-09-22 wording on the exam.","src":"SO3 03-09-22 — Limitation on the use of pretextual stops. 2026 Lieutenant bibliography. Q1 2026 Manual controls if the Order and Manual conflict.","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"man","q":"The Department motto is:","ch":["To Serve and Protect","To Protect and To Serve","Integrity First","Service Before Self"],"a":1,"ex":"Manual 1/100.","src":"Manual 1/100 — Q1 2026 Department Manual Vol. 1 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"The Department Vision is to, as closely as possible, achieve:","ch":["Zero uses of force","A City free from crime and public disorder","The highest arrest rate in the nation","Full staffing on every watch"],"a":1,"ex":"Manual 1/102.","src":"Manual 1/102 — Q1 2026 Department Manual Vol. 1 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"How many Core Values are listed in Manual Volume 1?","ch":["Four","Five","Six","Eight"],"a":2,"ex":"Six Core Values.","src":"Manual 1/110 — Q1 2026 Department Manual Vol. 1 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"pj","q":"Which is a Department Core Value?","ch":["CompStat first","Service to our communities","Maximum arrests","Zero discretion"],"a":1,"ex":"1/110.10 Service to Our Communities.","src":"Manual 1/110 — Q1 2026 Department Manual Vol. 1","url":""},{"topic":"man","q":"Policy differs from procedure in that policy:","ch":["Lists every step for a specific task","Establishes limits of action; procedure directs response within those limits","Is a specific prohibition with no exceptions","Is only for the Chief"],"a":1,"ex":"Manual 1/020.40.","src":"Manual 1/020.40 — Q1 2026 Department Manual Vol. 1 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"uof","q":"SB 230 required the Department to revise its use-of-force policy, including de-escalation when feasible and proportional force. That revision lives in:","ch":["Manual 3/810","Manual 1/556.10","Manual 4/120","SO5 2012 only"],"a":1,"ex":"Policy on Use of Force — 1/556.10.","src":"Manual 1/556.10 / SB 230 page — Q1 2026 Vol. 1","url":"https://www.lapdonline.org/police-commission/sb230-revised-policy/"},{"topic":"pj","q":"Discriminatory conduct based on actual or perceived race, religion, color, ethnicity, national origin, age, gender, gender identity or expression, sexual orientation, disability, immigration or employment status, English fluency, or homeless circumstance is:","ch":["Discouraged","Prohibited while performing any law enforcement activity","Allowed during gang investigations","A training issue only"],"a":1,"ex":"Manual 1/345. Failure to comply is serious misconduct.","src":"Manual 1/345 — biased policing policy","url":"https://www.lapdonline.org/community-inquiries-on-lapd-training-and-practice/"},{"topic":"pobor","q":"Government Code 3303 generally applies to interrogations that could lead to punitive action. The officer must normally be informed of the nature of the investigation prior to interrogation.","ch":["True","False"],"a":0,"ex":"Read the current text of 3303; there are listed exceptions.","src":"Gov. Code § 3303 — POBOR","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."},{"topic":"man","q":"Complaints shall be accepted from any source, including anonymous, third person, written, verbal, electronic, or TTY, at PAB, any Area, BOPC, or OIG.","ch":["True","False"],"a":0,"ex":"Manual 3/810.05.","src":"Manual 3/810.05 — Q1 2026 Department Manual Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Only supervisors shall initiate Complaint Forms.","ch":["True","False"],"a":0,"ex":"Note under complaints other than in-person.","src":"Manual 3/811.25 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"The watch commander who becomes aware of a complaint shall ensure a Complaint Form is prepared without unnecessary delay and shall review completeness, classify Disciplinary vs Non-Disciplinary, facilitate ACR when appropriate, then sign and send to the CO.","ch":["True","False"],"a":0,"ex":"Manual 3/811.05.","src":"Manual 3/811.05 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"IAG has no review responsibility for Non-Disciplinary complaints after the CF number is issued.","ch":["True","False"],"a":0,"ex":"Manual 3/818 Note.","src":"Manual 3/818 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Disciplinary allegations shall be dispositioned using Unfounded, Exonerated, Not Resolved, Sustained, Sustained-No Penalty, Insufficient Evidence to Adjudicate, Withdrawn by the COP (IAG only), or Duplicate.","ch":["True","False"],"a":0,"ex":"Manual 3/820.25.","src":"Manual 3/820.25 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"As a general rule, the commanding officer who managed the employee at the time of the occurrence shall adjudicate the complaint.","ch":["True","False"],"a":0,"ex":"Manual 3/825.","src":"Manual 3/825 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Non-Disciplinary complaints do not require a Letter of Transmittal.","ch":["True","False"],"a":0,"ex":"Manual 3/831.10.","src":"Manual 3/831.10 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Only sustained Department complaints (or public complaints with a mix of Sustained and Not Resolved) are filed in the employee’s personnel file. Other-than-sustained stay in IAG files.","ch":["True","False"],"a":0,"ex":"Manual 3/833.","src":"Manual 3/833 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"When a complaint is related to a Non-Categorical use of force, the investigating supervisor notifies the WC/OIC immediately. Differing versions of events do not by themselves equal an allegation of misconduct for assigning the preliminary investigation.","ch":["True","False"],"a":0,"ex":"Manual 3/830.10.","src":"Manual 3/830.10 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"If an employee refuses a chemical test in an administrative investigation, the order to submit for administrative purposes only is given by the first available officer of appropriate rank in this sequence: OIC or WC; employee’s CO; IAG investigator regardless of rank; other officer of appropriate rank.","ch":["True","False"],"a":0,"ex":"Form 01.28.08 Chemical Test Administrative Advisement.","src":"Manual 3/836 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"A Department employee detained or arrested (inside or outside the City, excluding traffic infractions) shall advise the detaining officer of Department status and notify his/her WC, or RACR if the assignment is closed.","ch":["True","False"],"a":0,"ex":"Manual 3/837.10.","src":"Manual 3/837.10 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"When an employee is detained inside the City, the WC/supervisor shall notify the employee’s WC or RACR, notify IAG (or RACR for on-call IAG), respond and do a preliminary investigation, and prepare a 1.28.","ch":["True","False"],"a":0,"ex":"Traffic-related in-City collisions/assaults with a vehicle go to the traffic division WC, bureau of occurrence.","src":"Manual 3/837.10 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Approval for a strip or involuntary clothing search in an administrative investigation requires a commander or above in the chain of command AND a captain or civilian CO from the employee’s division/Area at scene (or a staff officer in the chain if the captain is unavailable).","ch":["True","False"],"a":0,"ex":"Same-sex search, out of public view. Employee may have up to two hours for a representative.","src":"Manual 3/839.22 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Inactive duty may be ordered by a watch commander when it is contrary to the Department’s best interests for the employee to continue regular duties pending investigation or formal discipline.","ch":["True","False"],"a":0,"ex":"Manual 3/840.10.","src":"Manual 3/840.10 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"The Chief of Police has authority to seize or return an officer’s firearm. That authority is exercised through the Director, Office of Administrative Services; if unavailable, contact CO Personnel Group.","ch":["True","False"],"a":0,"ex":"Final authority remains with the COP.","src":"Manual 3/840.30 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"An employee returning from suspension reports in person to the CO. Written bureau CO approval is required before reissuing City firearms and ammo; the BCO must confer with IAG, BSS, or Legal Affairs as applicable.","ch":["True","False"],"a":0,"ex":"Manual 3/860.30.","src":"Manual 3/860.30 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"man","q":"Upon notification of a retaliation complaint, the supervisor shall meet the complainant and the accused, explain the process, warn against retaliation, watch the workplace, and immediately initiate a complaint for retaliatory acts.","ch":["True","False"],"a":0,"ex":"Supervisors are evaluated on the response, similar to CUOF response.","src":"Manual 3/890 — Q1 2026 Vol. 3 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"When reviewing IRs, arrest reports, or any crime reports, watch commanders shall ensure officers documented whether a Marsy’s Rights Card was provided.","ch":["True","False"],"a":0,"ex":"If not provided, the WC ensures one is provided, mailed, emailed, or faxed.","src":"Manual 4/203.34 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Officers shall issue a DVV pamphlet to victims of violent crimes and all victims of domestic violence. WC checks the narrative or checkbox on review.","ch":["True","False"],"a":0,"ex":"Manual 4/203.36.","src":"Manual 4/203.36 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"The senior officer at scene shall immediately notify the Area WC of a homicide or suspected homicide, a crime of violence likely to cause death, extortion or threat, kidnapping, major press potential, a citywide-problem crime, or information needing immediate follow-up.","ch":["True","False"],"a":0,"ex":"WC then notifies RHD for kidnapping with SBI/death potential, Area detectives, the responsible investigative CO, or DSVD when closed.","src":"Manual 4/201 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"When a parolee is booked on a felony, the WC approving booking promptly notifies the parole officer or parole agency.","ch":["True","False"],"a":0,"ex":"CYA notification only when a hold is requested.","src":"Manual 4/201.37 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"An FI shall be completed for all arrested persons except plain drunk, begging, or a misdemeanor traffic warrant, unless other criminal activity is indicated.","ch":["True","False"],"a":0,"ex":"Manual 4/202.01.","src":"Manual 4/202.01 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"When a minor is taken into temporary custody for 601/602 WIC and the officer does not intend to interrogate, the officer provides the 625 advisement, does not seek a waiver, and does not ask if the minor understands.","ch":["True","False"],"a":0,"ex":"Gladys R. questionnaire after Miranda and before questioning if the minor is under 14 and will be interrogated.","src":"Manual 4/202.30 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"A juvenile escapee is booked and detained as advised by the Watch Commander, DSVD, after telephone notification.","ch":["True","False"],"a":0,"ex":"Manual 4/670.10.","src":"Manual 4/670.10 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"When it is learned a person under 18 was booked as an adult and no adult complaint issued, the WC causes segregation, notifies the I/O, obtains a new booking number, and rebooks as a juvenile.","ch":["True","False"],"a":0,"ex":"Misrepresentation of age that delayed the investigation can add up to 48 hours after true age is known.","src":"Manual 4/705.62 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"A progress report on an unsolved homicide is due from detectives to their CO within:","ch":["30 days","60 days","120 days of case assignment","One year"],"a":2,"ex":"120 days.","src":"Manual Vol. 4 — unsolved homicides (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Telephonic homicide notification by the homicide I/O goes to the concerned operations bureau office and the Administrative Unit, DSVD, as soon as practical after the preliminary investigation.","ch":["True","False"],"a":0,"ex":"Manual 4/710.10.","src":"Manual 4/710.10 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Before taking a missing-adult report, the interviewing officer attempts to locate the person by calling MPU/DSVD, MEU, LAC+USC, records for traffic collisions, IRC, and the Coroner.","ch":["True","False"],"a":0,"ex":"Manual 4/712.05.","src":"Manual 4/712.05 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Gang History Books shall not be removed from the Area station without prior approval from the Area Commanding Officer. The WC shall have access to all gang files including those books.","ch":["True","False"],"a":0,"ex":"Only authorized gang investigation units maintain the books.","src":"Manual 4/721.15 Note (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Arrest narratives are not required for felony warrant arrests except parole/probation holds, UOF, recovered evidence, injuries that could be attributed to officers, aggravated/unusual circumstances, or WC direction.","ch":["True","False"],"a":0,"ex":"Manual 4/725.48.","src":"Manual 4/725.48 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"The Warrant Review Officer shall be Sergeant I, Detective II, or higher and conducts the final quality-assurance review of search and arrest warrants.","ch":["True","False"],"a":0,"ex":"Manual 4/742.","src":"Manual 4/742 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"ops","q":"Approval to search a news-media facility is requested on a 15.2 through the chain to the Chief of Police. After hours, emergency requests go through the DSVD WC with bureau staff-officer approval.","ch":["True","False"],"a":0,"ex":"Manual 4/742.50.","src":"Manual 4/742.50 — Q1 2026 Vol. 4 (Manual citation — verify in the current Q1 2026 Manual; no public deep-link in the app.)","url":""},{"topic":"fog","q":"Eight qualities of effective Incident Commanders include command presence, ICS understanding, proven management, strong decision-making, calm quick thinking, good communication, adaptability, recognizing limitations, and political awareness.","ch":["True","False"],"a":0,"ex":"Command presence is not the same as rank.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"ICS accountability includes check-in, operations directed by the IAP, unity of command, personal responsibility, span of control, and resource tracking.","ch":["True","False"],"a":0,"ex":"Essential ICS feature 12.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"fog","q":"Personnel and equipment should respond only when requested or dispatched by an appropriate authority.","ch":["True","False"],"a":0,"ex":"ICS Dispatch/Deployment.","src":"Field Operations Guide (on the 2026 Lt bibliography; current copy is Department/LAN — no public deep-link).","url":""},{"topic":"so","q":"The official 2026 Lieutenant bibliography is published by the City Personnel Department. Questions (except some crime-math items) come from that list.","ch":["True","False"],"a":0,"ex":"Bookmark the live bibliography; Q1 2026 Manual supersedes conflicting older SOs/AOs.","src":"2026 Police Lieutenant Bibliography — Personnel Department","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"so","q":"If a Special Order or Administrative Order conflicts with the Department Manual Quarter 1, 2026 text, the exam source note says the Q1 2026 Manual supersedes.","ch":["True","False"],"a":0,"ex":"Read the current Manual first, then the SO for history.","src":"2026 Lt Bibliography cover note","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"so","q":"2026 OCOP Administrative Orders and related directives are posted on the OCOP 2026 Docs page.","ch":["True","False"],"a":0,"ex":"Use that page plus the bibliography. Do not rely only on old study deck

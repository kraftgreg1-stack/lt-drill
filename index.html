"url":""},{"topic":"ics","q":"ICS priorities are life safety, incident stabilization, property preservation.","ch":["True","False"],"a":0,"ex":"EOG Vol. 4.","src":"EOG Vol. 4","url":"https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"},{"topic":"juv","q":"WIC 601 generally covers a minor who is beyond control, habitually truant, or a status offender — not a criminal-law violation.","ch":["True","False"],"a":0,"ex":"602 is the delinquency petition for a crime. 300 is dependency.","src":"WIC § 601","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=601."},{"topic":"juv","q":"WIC 602 is the section used when a minor is alleged to have committed an act that would be a crime if done by an adult.","ch":["True","False"],"a":0,"ex":"That is the delinquency path.","src":"WIC § 602","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=602."},{"topic":"juv","q":"WIC 300 is the dependency path — abuse, neglect, or a child who cannot be safely kept by a parent — not a 602 arrest for a crime.","ch":["True","False"],"a":0,"ex":"DCFS / court, not a delinquency petition.","src":"WIC § 300","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=300."},{"topic":"juv","q":"When a minor is taken into temporary custody for 601/602 and the officer will not interrogate, the officer gives the WIC 625 advisement, does not seek a waiver, and does not ask if the minor understands.","ch":["True","False"],"a":0,"ex":"Manual 4/202.30. Interrogation is a different track.","src":"Manual 4/202.30 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"If a minor under 14 will be interrogated, complete the Gladys R. questionnaire after Miranda and before questioning.","ch":["True","False"],"a":0,"ex":"Manual 4/202.30. Under-14 capacity to understand wrongfulness.","src":"Manual 4/202.30 Gladys R. — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"WIC 625 is the juvenile constitutional / rights advisement used when a minor is taken into temporary custody.","ch":["True","False"],"a":0,"ex":"SO11 03-26-20 and SO2 06-11-24 revised the Department form and language. Confirm Q1 2026 text.","src":"WIC § 625; SO11 03-26-20; SO2 06-11-24","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=625."},{"topic":"juv","q":"WIC 625.6 generally requires that a youth 17 or under consult with legal counsel before a custodial interrogation. Read the current statute for listed exceptions.","ch":["True","False"],"a":0,"ex":"Do not treat a study-deck paraphrase as a substitute for the code.","src":"WIC § 625.6","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=625.6."},{"topic":"juv","q":"WIC 627 generally requires notice to a parent or guardian when a minor is taken into custody, and that the minor be advised of the right to make calls.","ch":["True","False"],"a":0,"ex":"Read current 627 for timing and exceptions.","src":"WIC § 627","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=627."},{"topic":"juv","q":"SO11 03-26-20 revised WIC 625 juvenile rights language and the Juvenile Arrest Supplemental Report.","ch":["True","False"],"a":0,"ex":"2026 Lt bibliography.","src":"SO11 03-26-20 — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"SO2 06-11-24 again renamed/revised the WIC 625 juvenile advisement. Use the newest Manual / form, not a 2020 pocket card.","ch":["True","False"],"a":0,"ex":"2026 bibliography.","src":"SO2 06-11-24 — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"A juvenile escapee is booked and detained as the Watch Commander, DSVD, directs after telephone notification.","ch":["True","False"],"a":0,"ex":"Manual 4/670.10.","src":"Manual 4/670.10 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"If someone under 18 was booked as an adult and no adult complaint issued, the WC causes segregation, notifies the I/O, gets a new booking number, and rebooks as a juvenile.","ch":["True","False"],"a":0,"ex":"Misrepresentation of age that delayed the investigation can add time after true age is known — read 4/705.62.","src":"Manual 4/705.62 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"Missing-juvenile cases stay with Area detectives even after the person turns 18. Adult missing persons go to MPU, DSVD.","ch":["True","False"],"a":0,"ex":"Manual 4/712.","src":"Manual 4/712 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"A missing juvenile under 16, or any at-risk missing person, requires a dispatched unit, citywide broadcast, 03.16.00 without delay, a photo, a DR, and a supervisor.","ch":["True","False"],"a":0,"ex":"At-risk includes foul play, medical need, no runaway pattern, parental abduction, or mental impairment.","src":"Manual 4/712 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"An Area missing-person teletype does not satisfy the two-hour NCIC rule for a person under 21 or a missing person under exceptional circumstances.","ch":["True","False"],"a":0,"ex":"Manual 4.","src":"Manual 4 — NCIC two-hour missing-person rule","url":""},{"topic":"juv","q":"Amber Alert requires confirmed abduction, age or disability as listed, imminent danger of SBI or death, and usable descriptors.","ch":["True","False"],"a":0,"ex":"Manual 4/712.20.","src":"Manual 4/712.20 Amber — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"School-staff sexual abuse of a minor: telephonic notice to SECU, Juvenile Division. Patrol or J-car keeps the preliminary unless Juvenile takes the case.","ch":["True","False"],"a":0,"ex":"Detective Bureau Notices on the bibliography.","src":"Det Bureau Notices — SECU — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"SO17 12-07-23 revised reporting of suspected child-abuse investigations.","ch":["True","False"],"a":0,"ex":"Pair with PC 11166 mandated-reporter duties.","src":"SO17 12-07-23 — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"PC 11166 is the mandated-reporter child-abuse reporting statute. A watch commander does not sit on a report to 'see how it plays out.'","ch":["True","False"],"a":0,"ex":"Read current 11166 for timing and to whom.","src":"Penal Code § 11166","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=11166."},{"topic":"juv","q":"SO16 12-13-22 established LGBTQ policy and revised transportation and custody language, including juvenile-female transport/custody titles.","ch":["True","False"],"a":0,"ex":"2026 bibliography. Same-sex / privacy rules stay in the current Manual.","src":"SO16 12-13-22 — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"SO22 12-27-23 revised bomb threats at schools and investigations on school campuses, and targeted-mass-violence investigations.","ch":["True","False"],"a":0,"ex":"Campus + juvenile nexus. Read current OO/Manual for who goes to the school.","src":"SO22 12-27-23 — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"Force shall not be used to compel an arrestee — including a juvenile — to stand in a show-up.","ch":["True","False"],"a":0,"ex":"Manual 4/725.48 Note.","src":"Manual 4/725.48 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"WIC 827 restricts who may see juvenile case files. Do not hand a 602 packet to a reporter or a curious parent of another child.","ch":["True","False"],"a":0,"ex":"Confidential juvenile records.","src":"WIC § 827","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=827."},{"topic":"juv","q":"Sight-and-sound separation: a juvenile in a Department facility is not housed or mixed with adult prisoners as if they were just another booking.","ch":["True","False"],"a":0,"ex":"Federal JJDPA / state rules. WC checks the holding area.","src":"Manual Vol. 4 juvenile custody / separation — confirm Q1 2026 text","url":""},{"topic":"juv","q":"A 601 status offender is not treated as a 602 criminal booking just because the parent is angry and wants the child 'taught a lesson.'","ch":["True","False"],"a":0,"ex":"Wrong petition type is a WC problem.","src":"WIC §§ 601 and 602","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=601."},{"topic":"juv","q":"When a minor is not going to be interrogated, do not treat the 625 advisement as a Miranda waiver interview.","ch":["True","False"],"a":0,"ex":"Manual 4/202.30.","src":"Manual 4/202.30 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"SO1 01-14-21 concerns interrogation of suspects and Miranda / constitutional-rights advisement. Pair it with the juvenile 625 package when the suspect is a minor.","ch":["True","False"],"a":0,"ex":"2026 bibliography.","src":"SO1 01-14-21 — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"A Critical Missing juvenile is worked by Area Juvenile Detectives. A Critical Missing adult is MPU, DSVD.","ch":["True","False"],"a":0,"ex":"Detective Bureau Notices.","src":"Det Bureau Notices — critical missing — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"Cell-phone exigency pings on a critical missing go through MCD; off-hours exigency involves the CO, DSVD.","ch":["True","False"],"a":0,"ex":"Detective Bureau Notices.","src":"Det Bureau Notices — critical missing / MCD","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"Juvenile Diversion is a listed knowledge area on the Lieutenant bulletin. Know that diversion is a Department/program path, not 'cut the kid loose with no paper.'","ch":["True","False"],"a":0,"ex":"Bulletin: Juvenile Diversion Program. Read current Area practice + Manual.","src":"2026 Lt exam bulletin / bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"Photographing or printing a juvenile follows Manual rules — it is not 'same as an adult felony booking' by default.","ch":["True","False"],"a":0,"ex":"Confirm current Vol. 4 juvenile ID sections.","src":"Manual Vol. 4 juvenile identification — Q1 2026","url":""},{"topic":"juv","q":"A school police or school-administrator 'we already Mirandized him' statement does not replace a proper 625 / 625.6 / counsel consult when LAPD will interrogate.","ch":["True","False"],"a":0,"ex":"Department advisement and 625.6 still apply to your interrogation.","src":"WIC §§ 625 and 625.6","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=625.6."},{"topic":"juv","q":"If DCFS has the child on a 300 hold, that is not automatically a 602 arrest. Do not double-book the child as a criminal just to 'make a package.'","ch":["True","False"],"a":0,"ex":"WIC 300 vs 602.","src":"WIC § 300 vs § 602","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=300."},{"topic":"juv","q":"Parent on scene demanding to sit in on the interrogation does not, by itself, cancel 625.6 counsel-consult rules.","ch":["True","False"],"a":0,"ex":"Read current 625.6 exceptions. Parent presence ≠ counsel.","src":"WIC § 625.6","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=625.6."},{"topic":"juv","q":"A WC reviewing a juvenile arrest package looks for: correct petition type, 625 given when required, parent/DSVD notifications, Gladys R. if under 14 and questioned, and no adult-tank mix.","ch":["True","False"],"a":0,"ex":"That is the WC quality-control list.","src":"Manual 4/202.30 and 4/705 — Q1 2026 Vol. 4","url":""},{"topic":"juv","q":"SO7 03-09-21 revised Missing/Found Persons. Juvenile missing-person practice still lives in Manual 4/712 plus that SO history.","ch":["True","False"],"a":0,"ex":"Q1 2026 Manual wins if they conflict.","src":"SO7 03-09-21; Manual 4/712","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"Do not ask a juvenile arrestee their immigration status to 'help ICE.' Department policy forbids status questions of arrestees/detainees.","ch":["True","False"],"a":0,"ex":"Manual Vol. 4 immigration note; SO1 03-04-25 ILO package.","src":"Manual Vol. 4 — immigration status questions","url":""},{"topic":"juv","q":"A runaway 601 is not an Amber Alert. Amber is a listed abduction / danger package, not every missing teen.","ch":["True","False"],"a":0,"ex":"Manual 4/712.20 criteria.","src":"Manual 4/712.20","url":""},{"topic":"juv","q":"Hate-crime IR rules still apply when the victim or suspect is a juvenile. Confidentiality of the juvenile file does not mean 'no IR.'","ch":["True","False"],"a":0,"ex":"Manual 4 hate crime + WIC 827 on who sees the file.","src":"Manual 4 Hate Crime; WIC § 827","url":""},{"topic":"juv","q":"Campus threat / bomb-at-school: SO22 plus FOG bomb distances. The school is not 'just another building' for notifications.","ch":["True","False"],"a":0,"ex":"SO22 12-27-23 and FOG bomb pages.","src":"SO22 12-27-23; FOG bomb","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"The Juvenile Arrest Supplemental Report exists because a 5.2 adult arrest face sheet does not capture required juvenile fields.","ch":["True","False"],"a":0,"ex":"SO11 activated/revised that form path. Use the current form.","src":"SO11 03-26-20 — Juvenile Arrest Supplemental Report","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"A 14-year-old 602 robbery suspect is still a juvenile for housing, advisement, and court. Age 18 is the adult-booking line unless a listed exception applies.","ch":["True","False"],"a":0,"ex":"Do not 'book adult because the crime was ugly.'","src":"Manual 4/705.62; WIC 602","url":""},{"topic":"juv","q":"If the minor invokes or counsel is required under 625.6, questioning stops. 'We just need to find the gun for public safety' is not a blank check — read the current public-safety exception law.","ch":["True","False"],"a":0,"ex":"WC should get a supervisor and, if needed, detective/charging advice.","src":"WIC § 625.6","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=625.6."},{"topic":"juv","q":"Notifications to a school after a student arrest follow current Manual / school-notification rules. Do not post the arrest on the Area social account.","ch":["True","False"],"a":0,"ex":"WIC 827 + media policy.","src":"WIC § 827; Manual confidentiality","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=827."},{"topic":"juv","q":"A WC who finds a 16-year-old in the adult tank with no segregation plan fixes it immediately and documents. That is not a 'next watch' problem.","ch":["True","False"],"a":0,"ex":"Separation rules + 4/705.62 if booked wrong.","src":"Manual 4/705.62 and juvenile custody","url":""},{"topic":"juv","q":"Found-person / located-runaway still needs the missing-person system updated. Closing the radio call is not closing NCIC.","ch":["True","False"],"a":0,"ex":"Manual 4/712 and SO7 missing/found.","src":"Manual 4/712","url":""},{"topic":"juv","q":"Interviewing a child victim of sexual abuse is not a 'get a full statement in the back seat' job. Follow current SECU / Juvenile / DCFS protocol.","ch":["True","False"],"a":0,"ex":"Det Bureau Notices + child-abuse SOs.","src":"Det Bureau Notices; SO17 12-07-23","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"juv","q":"A private-person arrest of a juvenile still needs WC booking review. The citizen does not pick 601 vs 602.","ch":["True","False"],"a":0,"ex":"WC classifies and accepts or refuses custody under Manual rules.","src":"Manual Vol. 4 booking approval / juveniles","url":""},{"topic":"juv","q":"Curfew and truancy are typically 601-type problems, not automatic 602 felonies.","ch":["True","False"],"a":0,"ex":"WIC 601.","src":"WIC § 601","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=601."},{"topic":"juv","q":"The Lieutenant exam bulletin lists arrest, detention, and disposition of prisoners and the Juvenile Diversion Program as testable knowledge. Juvenile is not 'detective-only trivia.'","ch":["True","False"],"a":0,"ex":"City Personnel bulletin for Police Lieutenant 2232.","src":"2026 Police Lieutenant examination bulletin","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"Treat a probationer the same way for notification: if the booking package shows formal probation, the WC ensures the probation officer / agency is notified per current Manual practice.","ch":["True","False"],"a":0,"ex":"Do not wait until filing. Holds die when nobody calls.","src":"Manual 4/201.37 analog — parole/probation notification, Vol. 4","url":""},{"topic":"prob","q":"Penal Code 1203 is the adult probation-granting statute. Know the word 'probation' in a package means a court-ordered grant, not 'he's on a program.'","ch":["True","False"],"a":0,"ex":"Read current 1203 if the question is statutory.","src":"Penal Code § 1203","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203."},{"topic":"prob","q":"PC 1203.2 authorizes arrest of a probationer for a violation, including in many cases without a warrant when the officer has probable cause the person violated probation.","ch":["True","False"],"a":0,"ex":"Read the current text for peace-officer vs probation-officer language.","src":"Penal Code § 1203.2","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203.2."},{"topic":"prob","q":"A probation search condition is not a general warrant to search every roommate's locked room. Stay inside the condition and the nexus.","ch":["True","False"],"a":0,"ex":"Fourth Amendment + the written terms. Document the condition you relied on.","src":"PC 1203.2 / probation search conditions","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203.2."},{"topic":"prob","q":"PRCS (Post Release Community Supervision) is not the same thing as formal probation. Do not write 'probation hold' when the sheet says PRCS.","ch":["True","False"],"a":0,"ex":"PRCS is a post-realignment supervision status. Call the right agency.","src":"2026 Lt knowledge area — supervision statuses","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"Parole is CDCR / DAPO. Adult probation is the county probation department. Juvenile probation is also county probation, different unit.","ch":["True","False"],"a":0,"ex":"Wrong agency = missed hold.","src":"Manual 4/201.37; field booking practice","url":""},{"topic":"prob","q":"A 'no-bail probation hold' is placed by the supervising agency or the court, not invented on the booking slip by the arresting officer.","ch":["True","False"],"a":0,"ex":"WC confirms the hold is real before telling the jail it is no-bail.","src":"Manual Vol. 4 booking / holds","url":""},{"topic":"prob","q":"Felony-warrant narratives are required when there is a parole or probation hold (among other listed exceptions).","ch":["True","False"],"a":0,"ex":"Manual 4/725.48.","src":"Manual 4/725.48 — Q1 2026 Vol. 4","url":""},{"topic":"prob","q":"If two sergeants argue about extending a stop on a probationer, the WC decides with the condition sheet and PC — not who is louder.","ch":["True","False"],"a":0,"ex":"Supervision + constitutional stops.","src":"Manual Vol. 3 supervision; PC 1203.2","url":""},{"topic":"prob","q":"A probation officer in the field is not automatically the incident commander at your crime scene.","ch":["True","False"],"a":0,"ex":"ICS / scene ownership stays with the police IC until transferred.","src":"EOG / ICS command; probation is a cooperating agency","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"Sharing a juvenile 602 file with the minor's probation officer is a WIC 827 analysis, not an open-records dump.","ch":["True","False"],"a":0,"ex":"827 lists who may inspect. Probation is often a listed party — confirm before you email the PDF to a personal account.","src":"WIC § 827","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=827."},{"topic":"prob","q":"Juvenile formal probation is a court disposition after a 602 finding (or equivalent). It is not the same as informal 'station diversion.'","ch":["True","False"],"a":0,"ex":"Diversion vs court probation.","src":"WIC 602 disposition / Juvenile Diversion bulletin area","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"Home supervision / electronic monitoring of a juvenile is a probation-department tool. LAPD does not 'cut the bracelet off' in the field without that agency.","ch":["True","False"],"a":0,"ex":"Call the PO / on-call probation.","src":"County juvenile probation practice; WC notification","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"Flash incarceration (short jail hit as a sanction) is a supervision tool. It is not a new 602 for every dirty test unless charging says so.","ch":["True","False"],"a":0,"ex":"Know the difference: sanction vs new crime.","src":"PC 1203.2 / realignment sanctions","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203.2."},{"topic":"prob","q":"Mandatory supervision under 1170(h) is not classic 1203 probation. Use the right label on the IR and the hold request.","ch":["True","False"],"a":0,"ex":"Realignment statuses matter on a Lieutenant exam.","src":"PC 1170(h) mandatory supervision vs PC 1203","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203."},{"topic":"prob","q":"An interstate compact probationer is still a probationer. Do not ignore the out-of-state packet because 'that's not our PO.'","ch":["True","False"],"a":0,"ex":"Notify the listed supervising agency.","src":"Interstate compact / booking notifications","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"If the probationer is also a registered 290, supervision status does not cancel sex-offender index rules. Do not give index data by phone.","ch":["True","False"],"a":0,"ex":"Manual 3/413.05.","src":"Manual 3/413.05 — Q1 2026 Vol. 3","url":""},{"topic":"prob","q":"A PO asking you to 'just kick the door because he's on search terms' still needs you to confirm the condition, the address, and who lives there.","ch":["True","False"],"a":0,"ex":"You own the Fourth Amendment decision.","src":"Probation search conditions; PC 1203.2","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203.2."},{"topic":"prob","q":"Probation violation and a new crime can both exist. Book the new crime; let the PO place the violation hold. Do not pick only the hold and dump the 211.","ch":["True","False"],"a":0,"ex":"WC reviews both tracks.","src":"Manual Vol. 4 booking; PC 1203.2","url":""},{"topic":"prob","q":"When a juvenile on probation is arrested for a new 602, notify the assigned juvenile PO as well as parents/DSVD as required.","ch":["True","False"],"a":0,"ex":"Two systems: police booking + probation supervision.","src":"Manual 4/202.30; 4/201.37 analog","url":""},{"topic":"prob","q":"A probation search of a phone is not automatically covered because 'he's on paper.' Look at the written electronics condition.","ch":["True","False"],"a":0,"ex":"Riley + the four corners of the terms.","src":"Probation search conditions / electronics","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203.2."},{"topic":"prob","q":"Do not hold a probationer extra hours 'until the PO gets to work at 0800' if you have no crime, no hold, and no PC.","ch":["True","False"],"a":0,"ex":"Fourth Amendment + booking time rules.","src":"Manual Vol. 4 detention; PC 1203.2","url":""},{"topic":"prob","q":"If the PO wants the person released to a program instead of jail, that is a custody decision with the WC / jail — not a field officer freelance drop-off.","ch":["True","False"],"a":0,"ex":"Document who authorized release.","src":"Manual Vol. 4 booking approval","url":""},{"topic":"prob","q":"Adult probation officers are peace officers under designated code sections for their duties. That does not make them LAPD supervisors.","ch":["True","False"],"a":0,"ex":"They do not outrank your sergeant on an LAPD scene.","src":"PC 830-series / probation authority; ICS","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"A 'probation search' documented with no mention of the actual condition will get shredded in a motion. Write the words from the terms.","ch":["True","False"],"a":0,"ex":"Report writing is a Lieutenant exam neighbor of supervision.","src":"Manual Vol. 4 reports; search conditions","url":""},{"topic":"prob","q":"If records show expired probation, you do not get a 1203.2 arrest on a lapsed grant. Confirm status before you sell the hold to the jail.","ch":["True","False"],"a":0,"ex":"Expired paper is expired.","src":"PC 1203.2","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203.2."},{"topic":"prob","q":"Gang conditions (stay-away, no colors) are probation terms, not a separate LAPD gang file. Still follow 4/721.15 on who maintains gang books.","ch":["True","False"],"a":0,"ex":"Manual 4/721.15.","src":"Manual 4/721.15 — Q1 2026 Vol. 4","url":""},{"topic":"prob","q":"A victim of a probationer's new DV still gets a DVV pamphlet and Marsy card. Supervision status of the suspect changes nothing for the victim.","ch":["True","False"],"a":0,"ex":"Manual 4/203.34 and 4/203.36.","src":"Manual 4/203.34–.36","url":""},{"topic":"prob","q":"Do not use the probationer as your CI while he is in your back seat on a hold. Informant rules still apply; uniformed officers do not keep CIs.","ch":["True","False"],"a":0,"ex":"Detective Bureau Notices.","src":"Det Bureau Notices — informants — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"If the arrest is only a probation violation with no new crime, say so on the face sheet. Do not invent a 148 to make it look like a fresh felony.","ch":["True","False"],"a":0,"ex":"Truth in charging / booking.","src":"Manual Vol. 4 arrest reports; PC 1203.2","url":""},{"topic":"prob","q":"County jail and juvenile hall are different receiving points. A 16-year-old on juvenile probation does not go to Men's Central 'because he's big.'","ch":["True","False"],"a":0,"ex":"Manual 4/705.62 and juvenile housing.","src":"Manual 4/705.62","url":""},{"topic":"prob","q":"When RACR / DSVD is needed on a juvenile probation arrest after hours, use the same after-hours path you use for other juvenile bookings.","ch":["True","False"],"a":0,"ex":"Manual 4/670 / DSVD WC.","src":"Manual 4/670.10","url":""},{"topic":"prob","q":"A search condition does not authorize a strip search. Strip-search rules in an administrative or jail context are separate Manual sections.","ch":["True","False"],"a":0,"ex":"Manual 3/839.22 is employee strips; arrestee strips have their own rules — do not mix them.","src":"Manual strip-search rules; probation conditions","url":""},{"topic":"prob","q":"If the PO is the reporting party on a violation and there is no new victim crime, you may still need an IR or a booking package. 'Verbal only' is a WC call based on current Manual.","ch":["True","False"],"a":0,"ex":"Document the violation facts.","src":"Manual Vol. 4 reports; PC 1203.2","url":""},{"topic":"prob","q":"Firearms and probation: many grants bar possession. That is .","src":"PC 1203.2; report documentation","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=1203.2."},{"topic":"prob","q":"If the probationer is injured in custody, injured-arrestee rules (SO30 / Manual) still apply. Paper status does not cancel an RA.","ch":["True","False"],"a":0,"ex":"SO30 12-09-20 injured suspects/arrestees.","src":"SO30 12-09-20 — 2026 bibliography","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"A PO's request for a welfare check on a juvenile probationer is still a police response with Department tactics — not a guaranteed door-kick.","ch":["True","False"],"a":0,"ex":"Community caretaking + Fourth Amendment.","src":"SO14 07-30-21 community caretaking; 4th Amendment","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"Disposition of a 602 (home on probation, camp, etc.) is the court's call. Field officers do not promise 'you'll just get informal.'","ch":["True","False"],"a":0,"ex":"Don't bargain dispositions you don't control.","src":"WIC 602 dispositions","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=WIC&sectionNum=602."},{"topic":"prob","q":"When the booking charge is only 1203.2, list the underlying grant and the violation facts in the narrative.","ch":["True","False"],"a":0,"ex":"Jail and court cannot guess.","src":"Manual 4/725.48; PC 1203.2","url":""},{"topic":"prob","q":"A Lieutenant on a pursuit or UOF involving a probationer still runs the Department pursuit/UOF policy. Status on paper is not an exception.","ch":["True","False"],"a":0,"ex":"SO5 07-01-25 pursuit; 1/556.10 UOF.","src":"Manual 1/556.10; pursuit SOs","url":"https://personnel.lacity.gov/doc.cfm?get=2232Biblio"},{"topic":"prob","q":"Do not release a juvenile to 'his PO said it's fine' without following Department release-from-custody and parent/guardian rules.","ch":["True","False"],"a":0,"ex":"Booking approval / RFC Manual sections.","src":"Manual Vol. 4 release from custody; juveniles","url":""},{"topic":"prob","q":"AB 109 / realignment changed who supervises many people formerly on state parole. If the sheet says probation or mandatory supervision, call the county, not CDCR by habit.","ch":["True","False"],"a":0,"ex":"Wrong phone number = no hold.","src":"Realignment supervision vs parole — 4/201.37 practice","url":""},{"topic":"prob","q":"The WC log should show probation/parole notification time, agency, and person notified when a hold or felony booking requires it.","ch":["True","False"],"a":0,"ex":"If it is not on the log, it did not happen for the exam or the lawsuit.","src":"Manual 4/201.37; WC Daily Report practice","url":""},{"topic":"prob","q":"A probation officer’s field notes are not a substitute for your IR. If LAPD takes a crime report, write the Department report.","ch":["True","False"],"a":0,"ex":"Two agencies, two records. Do not assume the PO’s chrono covers your 3.01.","src":"Manual Vol. 4 crime/arrest reports","url":""}];
const ORAL=["You are the WC. A sergeant says a probationer pointed a firearm at a handcuffed passenger. Go.","Your most productive officer has two rudeness complaints this month. Captain says handle it. Go.","A pursuit was terminated by the other division WC while your unit was still behind the car. Your sergeant is angry on the radio. Go.","An outside agency wants to interview one of your officers as a witness tomorrow and does not want POBOR to slow it down. Go.","You have 12 units and a missing 9-year-old at dusk in a dense apartment complex. Prioritize.","An employee says they are being sexually harassed by a well-liked supervisor on another watch. Go."];
const state={view:"home",deck:[],i:0,score:0,answered:false,picked:null,left:20,timer:null,listening:false,_afterSpeak:null,exam:true,filter:null,n:50,seen:[]};
function qid(item){return String(item.q||"").slice(0,120);}
function loadS(){try{return JSON.parse(localStorage.getItem("ltdrill-v2")||"{}")}catch(e){return {}}}
function saveS(s){try{localStorage.setItem("ltdrill-v2",JSON.stringify(s))}catch(e){}}
function stats(){
  const s=loadS();
  s.right=s.right||{}; s.wrong=s.wrong||{}; s.topic=s.topic||{}; s.history=s.history||[];
  return s;
}
function record(item,ok){
  const s=stats(); const id=qid(item);
  if(!s.topic[item.topic]) s.topic[item.topic]={r:0,w:0};
  if(ok){s.right[id]=(s.right[id]||0)+1; delete s.wrong[id]; s.topic[item.topic].r++;}
  else {s.wrong[id]=(s.wrong[id]||0)+1; s.topic[item.topic].w++;}
  saveS(s);
}
function srsMap(){const s=stats(); s.srs=s.srs||{}; return s;}
function schedule(item,grade){
  const s=srsMap(); const id=qid(item);
  let c=s.srs[id]||{box:1,due:0,reps:0};
  if(grade===0){c.box=1; c.due=Date.now();}
  else if(grade===1){c.box=Math.max(1,c.box); c.due=Date.now()+86400000;}
  else {c.box=Math.min(5,(c.box||1)+1); const days=[0,1,3,7,16,30][c.box]||30; c.due=Date.now()+days*86400000;}
  c.reps=(c.reps||0)+1; s.srs[id]=c; saveS(s);
}
function dueItems(){
  const now=Date.now(); const s=srsMap();
  return shuffle(BANK.filter(x=>{
    const c=s.srs[qid(x)];
    if(!c) return true;
    return c.due<=now && c.box<5;
  }));
}
function masteredCount(){return Object.values((stats().srs)||{}).filter(c=>c.box>=5).length;}
function dueCount(){return dueItems().length;}
function startDue(){
  const pool=dueItems();
  if(!pool.length){alert("Nothing due. Run a Random 50 first, then use Due today tomorrow.");return;}
  state.deck=pool.slice(0,50);state.i=0;state.score=0;state.answered=false;state.picked=null;state.view="quiz";render();
}
function grade(g){
  if(!state.answered) return;
  schedule(state.deck[state.i],g);
  next();
}

function missedItems(){
  const s=stats();
  return BANK.filter(x=>s.wrong[qid(x)]);
}
function weakTopics(){
  const s=stats();
  return Object.entries(s.topic).map(([k,v])=>{
    const n=v.r+v.w; const pct=n?v.r/n:1;
    return {k,pct,n};
  }).filter(x=>x.n>=3).sort((a,b)=>a.pct-b.pct);
}
function startMissed(){
  const pool=shuffle(missedItems());
  if(!pool.length){alert("No missed questions yet. Run a Random 50 first.");return;}
  state.deck=pool.slice(0,Math.min(50,pool.length));
  state.i=0;state.score=0;state.answered=false;state.picked=null;state.view="quiz";render();
document.addEventListener("keydown",function(e){
  if(state.view!=="quiz"&&state.view!=="drive") return;
  const k=e.key.toLowerCase();
  if(k==="a"||k==="1") pick(0);
  else if(k==="b"||k==="2") pick(1);
  else if(k==="c"||k==="3") pick(2);
  else if(k==="d"||k==="4") pick(3);
  else if(k==="n"||k==="enter"||k===" ") {e.preventDefault(); if(state.answered) next();}
  else if(k==="r") {if(state.view==="drive") driveAsk();}
  else if(state.answered && (k==="z")) grade(0);
  else if(state.answered && (k==="x")) grade(1);
  else if(state.answered && (k==="c")) grade(2);
});
}
function startWeak50(){
  const weak=weakTopics().slice(0,4).map(x=>x.k);
  let pool;
  if(!weak.length) pool=BANK.slice();
  else {
    const hot=BANK.filter(x=>weak.includes(x.topic));
    const rest=BANK.filter(x=>!weak.includes(x.topic));
    pool=shuffle(hot).concat(shuffle(rest));
  }
  state.deck=shuffle(pool.slice(0,Math.min(80,pool.length))).slice(0,50);
  state.i=0;state.score=0;state.answered=false;state.picked=null;state.view="quiz";render();
}
function acc(){
  const s=stats();
  let r=0,w=0;
  Object.values(s.topic).forEach(v=>{r+=v.r;w+=v.w});
  const n=r+w; return {r,w,n,pct:n?Math.round(100*r/n):0,miss:Object.keys(s.wrong).length};
}


function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function $(s){return document.querySelector(s)}
function backBtn(label){return '<button class="btn sec" type="button" onclick="goBack()" style="min-width:72px">← '+(label||'Back')+'</button>'}
function goBack(){
  if((state.view==="quiz"||state.view==="drive") && state.i>0){
    state.i--; state.answered=false; state.picked=null;
    if(state.view==="drive"){ try{beginClock()}catch(e){} render(); try{setTimeout(driveAsk,200)}catch(e){} }
    else render();
    return;
  }
  go("home");
}
function topicName(k){return (TOPICS.find(t=>t[0]===k)||[k,k])[1]}
function cap(){return (window.Capacitor && Capacitor.Plugins) ? Capacitor.Plugins : {};}

async function speak(text, after){
  state._afterSpeak=after||null;
  const t=String(text||"");
  try{
    if(window.AndroidBridge && AndroidBridge.speak){ AndroidBridge.speak(t); return; }
  }catch(e){}
  try{
    const TTS=cap().TextToSpeech;
    if(TTS && TTS.speak){
      await TTS.speak({text:t, lang:"en-US", rate:0.96, pitch:1.0, category:"playback"});
      finishSpeak(); return;
    }
  }catch(e){}
  if(window.speechSynthesis){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.rate=0.96; u.lang="en-US";
    u.onend=finishSpeak; u.onerror=finishSpeak;
    speechSynthesis.speak(u); return;
  }
  finishSpeak();
}
function finishSpeak(){
  const f=state._afterSpeak; state._afterSpeak=null; if(f) f();
}
function onAndroidSpeakEnd(){ finishSpeak(); }
function stopSpeak(){
  try{ if(window.AndroidBridge && AndroidBridge.stop) AndroidBridge.stop(); }catch(e){}
  try{ const TTS=cap().TextToSpeech; if(TTS && TTS.stop) TTS.stop(); }catch(e){}
  if(window.speechSynthesis) speechSynthesis.cancel();
}

function parseChoice(text){
  const raw=(text||"").toLowerCase();
  const t=" "+raw.replace(/[^a-z0-9 ]/g," ")+" ";
  if(/\b(repeat|again|say that|what)\b/.test(t)) return "repeat";
  if(/\b(stop|end|quit|home|cancel)\b/.test(t)) return "stop";
  if(/\b(skip|next)\b/.test(t)) return "next";
  if(/\b(alpha|option a|answer a|letter a|\ba\b)\b/.test(t) || raw.trim()==="a") return 0;
  if(/\b(bravo|option b|answer b|letter b|\bb\b)\b/.test(t) || raw.trim()==="b") return 1;
  if(/\b(charlie|option c|answer c|letter c|\bc\b)\b/.test(t) || raw.trim()==="c") return 2;
  if(/\b(delta|option d|answer d|letter d|\bd\b)\b/.test(t) || raw.trim()==="d") return 3;
  return null;
}

async function listenOnce(){
  if(state.view!=="drive" || state.answered) return;
  state.listening=true; const pill=$("#timer"); if(pill) pill.textContent="Listening";
  try{
    if(window.AndroidBridge && AndroidBridge.listen){ AndroidBridge.listen(); return; }
  }catch(e){}
  try{
    const SR=cap().SpeechRecognition;
    if(SR){
      if(SR.requestPermissions) await SR.requestPermissions();
      if(SR.start){
        const res=await SR.start({language:"en-US", maxResults:3, prompt:"Say A, B, C, D, or repeat", partialResults:false, popup:false});
        const said=(res && (res.matches && res.matches[0] || res.value)) || "";
        onHeard(said); return;
      }
    }
  }catch(e){}
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){ state.listening=false; return; }
  try{
    const r=new Rec(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
    r.onresult=function(ev){ onHeard(ev.results[0][0].transcript); };
    r.onerror=function(){ state.listening=false; if(state.view==="drive"&&!state.answered) setTimeout(listenOnce,600); };
    r.onend=function(){ state.listening=false; };
    r.start();
  }catch(e){ state.listening=false; }
}
function onAndroidHeard(text){ onHeard(text||""); }
function onHeard(said){
  state.listening=false;
  if(state.view!=="drive") return;
  const cmd=parseChoice(said);
  if(cmd==="repeat"){ driveAsk(); return; }
  if(cmd==="stop"){ stopSpeak(); go("home"); return; }
  if(cmd==="next"){ next(); return; }
  if(typeof cmd==="number"){ pick(cmd); return; }
  if(!state.answered) setTimeout(listenOnce,500);
}
function driveAsk(){
  const item=state.deck[state.i]; if(!item||!item.ch){go('topics');return '<div class="warnbox">That deck is empty. Open Topics and pick FOG — Field Operations Guide.</div>';} if(!item) return;
  const letters=item.ch.map((c,idx)=>String.fromCharCode(65+idx)+". "+c).join(". ");
  const text="Question "+(state.i+1)+" of "+state.deck.length+". "+item.q+". "+letters+". Answer A, B, C, or D. Say repeat to hear it again.";
  speak(text, function(){ listenOnce(); });
}

function go(v){stopT();stopSpeak();state.view=v;state.answered=false;state.listening=false;render()}

function sourcesView(){
  const rows=[
    ["2026 Lt bibliography (Personnel)",LINKS.biblio,"Every listed SO, FOG, EOG, UOF directive, MOU, and legal bulletin starts here."],
    ["Q1 2026 Department Manual hub",LINKS.manual,"Official Volume 0–5 PDFs."],

    ["Volume 4 Line procedures PDF",LINKS.v4,"Codes, notifications, missing persons, warrants."],

    ["Use of Force / SB 230 page",LINKS.uof,"1/556.10 policy map."],
    ["Gov. Code 3303 (POBOR)",LINKS.pobor,"Interrogation rights statute."]
  ].map(([n,u,p])=>`<a class="card wide" style="margin-bottom:8px;display:block" href="${u}" target="_blank" rel="noopener"><h3>${n}</h3><p>${p}</p></a>`).join("");
  return `<div class="top">${backBtn()}<h1>Sources</h1></div><div class="warnbox">FOG, EOG Vols 2/4/5/6, UOF Directives, Protest Guide, MOU 24, and most SOs are not public HTML. Cards link to the official bibliography. Open your copy for the page. This drill covers SO titles, FOG quiz items, Manual Vol. 3 listed ranges, Vol. 4 line procedures, UOF directive titles, EOG volume IDs, POBOR, and crime math. It does NOT replace reading Legal Bulletins, the Legislative Digest pp. 1–7, Strategic Plan, or DEOP/COOP annex cover-to-cover.</div>`+rows;
}
function resetStats(){if(confirm("Clear missed pile and stats on this device?")){localStorage.removeItem("ltdrill-v2");render();}}
function statsView(){const s=stats();const rows=TOPICS.map(([k,n])=>{const v=s.topic[k]||{r:0,w:0};const tot=v.r+v.w;const pct=tot?Math.round(100*v.r/tot):"—";return `<div class="card wide" style="margin-bottom:8px"><h3>${n}</h3><p>${v.r} right / ${v.w} wrong · ${pct}% · ${tot} answered</p></div>`;}).join("");return `<div class="top">${backBtn()}<h1>Stats</h1></div><div class="statrow"><div class="stat"><b>${acc().pct}%</b><span>all-time</span></div><div class="stat"><b>${acc().miss}</b><span>missed</span></div><div class="stat"><b>${acc().n}</b><span>answered</span></div></div>${rows}<button class="btn sec" onclick="resetStats()">Reset stats on this device</button>`;}
function startQuiz(filter,n){
  state.filter=(filter===undefined)?state.filter:filter;
  const size=n||state.n||50;
  state.n=size;
  let pool=BANK.slice();
  if(state.filter) pool=pool.filter(x=>x.topic===state.filter);
  const seen=new Set(state.seen||[]);
  let fresh=pool.filter(x=>!seen.has(qid(x)));
  if(fresh.length<size){ state.seen=[]; fresh=pool.slice(); }
  state.deck=shuffle(fresh).slice(0,Math.min(size,fresh.length));
  state.seen=(state.seen||[]).concat(state.deck.map(qid));
  state.i=0;state.score=0;state.answered=false;state.picked=null;state.view="quiz";render();
}
function startRandom50(){ startQuiz(null,50); }

function startDrive(n){
  const pool=shuffle(BANK);
  const d=[]; for(let k=0;k<n;k++) d.push(pool[k%pool.length]);
  state.deck=d;state.i=0;state.score=0;state.answered=false;state.picked=null;state.left=20;state.view="drive";render();beginClock();
  setTimeout(driveAsk,300);
}
function stopT(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function beginClock(){
  stopT();state.left=20;
  state.timer=setInterval(()=>{
    if(state.view!=="drive"||state.answered){stopT();return}
    state.left--;
    const el=$("#timer"); if(el && !state.listening) el.textContent=state.left+"s";
    if(state.left<=0){stopT();state.answered=true;speak("Time. The answer is "+String.fromCharCode(65+state.deck[state.i].a)+".");render()}
  },1000);
}
function pick(idx){
  if(state.answered) return;
  const item=state.deck[state.i]; if(!item||!item.ch){go('topics');return '<div class="warnbox">That deck is empty. Open Topics and pick FOG — Field Operations Guide.</div>';}
  state.picked=idx;state.answered=true;
  const ok=idx===item.a;
  if(ok) state.score++;
  record(item,ok);
  if(!ok){
    const pos=Math.min(state.deck.length, state.i+3);
    state.deck.splice(pos,0,item);
  }
  stopT();render();
  if(state.view==="drive") speak(ok?"Correct. If you can, say the rule in one sentence.":"Wrong. The answer is "+String.fromCharCode(65+item.a)+". "+(item.ex||""));
}
function next(){
  state.i++;state.answered=false;state.picked=null;state.listening=false;
  if(state.view==="drive"&&state.i<state.deck.length){beginClock();render();setTimeout(driveAsk,300);}
  else render();
}

function home(){
  return `<div class="hero">
    <div class="top"><div style="display:flex;gap:12px;align-items:center">
      <div class="badgeimg" aria-label="Watch Drill">WD</div>
      <div class="pill">${BANK.length} cards</div>
    </div></div>
    <div class="kicker">COMMAND LIST</div>
    <h1>Watch Drill</h1>
    <p class="lead">Written drill, topics, and oral-board prompts for the list you are actually on.</p>
    <div class="sec-label">YOUR EXAM</div>
    <div class="examrow">
      <div class="exam"><b>Detective</b><span>Coming soon</span></div>
      <div class="exam"><b>Sergeant</b><span>Coming soon</span></div>
      <div class="exam on"><b>Lieutenant 2026</b><span>This list</span></div>
    </div>
    <div class="statrow"><div class="stat"><b>${acc().pct}%</b><span>accuracy</span></div><div class="stat"><b>${acc().n}</b><span>attempted</span></div><div class="stat"><b>${BANK.length}</b><span>from docs</span></div></div>
  </div>
  <div class="cards">
    <button class="card" onclick="startRandom50()"><h3>Written</h3><p>Shuffled multiple choice.</p></button>
    <button class="card" onclick="return false" style="opacity:.55"><h3>Drive</h3><p>Coming soon</p></button>
    <button class="card" onclick="go('topics')"><h3>Topics</h3><p>Special Orders, FOG, juveniles, UOF, WC.</p></button>
    <button class="card" onclick="go('board')"><h3>Board</h3><p>Interview is 100%. Essay is advisory.</p></button>
    <button class="card wide" onclick="startMissed()"><h3>Repair misses</h3><p>Only cards you have gotten wrong.</p></button>
    <button class="card wide" onclick="startDue()"><h3>Due today</h3><p>Spaced review.</p></button>
    <button class="card wide" onclick="go('sources')"><h3>Official source links</h3><p>Bibliography and public Manual PDFs only.</p></button>
  </div>`;
}
function topics(){
  return `<div class="top">${backBtn()}<h1>Topics</h1></div>`+TOPICS.map(([k,n])=>{
    const c=BANK.filter(x=>x.topic===k).length;
    return `<button class="card wide" style="margin-bottom:8px" onclick="startQuiz('${k}',50)"><h3>${n}</h3><p>${c} items</p></button>`;
  }).join("");
}
function quizView(drive){
  if(state.i>=state.deck.length){
    const a=acc();
    return `<div class="top">${backBtn("Home")}<h1>Session done</h1></div><div class="statrow"><div class="stat"><b>${state.score}/${state.deck.length}</b><span>${Math.round(100*state.score/Math.max(1,state.deck.length))}%</span></div><div class="stat"><b>${a.miss}</b><span>in missed pile</span></div><div class="stat"><b>${a.pct}%</b><span>all-time</span></div></div>
    <p class="small">That set is done. Next set is a new random draw from the same list. Cards you just saw are skipped until the list is used up.</p>
    <div class="row"><button class="btn" onclick="${drive?'startDrive(50)':'startQuiz(state.filter,state.n)'}">Next random set</button><button class="btn sec" onclick="startMissed()">Restudy misses</button><button class="btn sec" onclick="go('home')">Home</button></div>`;
  }
  const item=state.deck[state.i]; if(!item||!item.ch){go('topics');return '<div class="warnbox">That deck is empty. Open Topics and pick FOG — Field Operations Guide.</div>';}
  const letters=item.ch.map((c,idx)=>{
    let cls="choice";
    if(state.answered && idx===item.a) cls+=" good";
    if(state.answered && idx===state.picked && idx!==item.a) cls+=" bad";
    return `<button class="${cls}" onclick="pick(${idx})">${String.fromCharCode(65+idx)}. ${c}</button>`;
  }).join("");
  return `<div class="top">${backBtn()}<div><h1>${drive?'Drive ':'Q '}${state.i+1}/${state.deck.length}</h1><div class="sub">${topicName(item.topic)}</div></div>
    <div class="pill ${state.listening?'live':''}" id="timer">${drive?(state.listening?'Listening':state.left+'s'):(state.score+' correct')}</div></div>
    <div class="qbox">${item.q}</div>
    ${state.answered?`<div class="ref"><b>Reference:</b> ${item.src||item.ex||''}${item.url?` · <a class="srclink" href="${item.url}" target="_blank" rel="noopener">Open source</a>`:''}</div>`:`<div class="small">Reference hidden until you answer. After you pick, the citation becomes a link.</div>`}
    ${letters}
    ${drive&&!state.answered?`<div class="row"><button class="btn" onclick="driveAsk()">Repeat / listen</button><button class="btn sec" onclick="listenOnce()">Tap to speak</button></div>`:''}
    ${state.answered?`<div class="explain">${item.ex||''}${item.src?'<div class="small">'+item.src+'</div>':''}${item.url?'<div class="small"><a class="srclink" href="'+item.url+'" target="_blank" rel="noopener">Open source material</a></div>':''}<div class="small" style="margin-top:8px">How well did that stick? Again = see it in a few questions. Good = 3+ days.</div>
    <div class="row">
      <button class="btn sec" onclick="grade(0)">Again</button>
      <button class="btn sec" onclick="grade(1)">Hard</button>
      <button class="btn" onclick="grade(2)">Good</button>
    </div>
    <button class="btn sec" style="width:100%;margin-top:8px" onclick="next()">Skip schedule / Next</button></div>`:''}`;
}
function board(){
  return `<div class="top">${backBtn()}<h1>Interview</h1></div><div class="warnbox">Interview is 100% of the score. Essay is advisory and goes to the board.</div>`+
    ORAL.map(s=>`<div class="card wide" style="margin-bottom:8px"><p>${s}</p></div>`).join("");
}
function render(){
  try{
    const map={home,topics,quiz:()=>quizView(false),drive:()=>quizView(true),board,stats:statsView,sources:sourcesView};
    const html=(map[state.view]||home)();
    const el=$("#app");
    if(!el){document.body.insertAdjacentHTML("afterbegin", html); return;}
    el.innerHTML=html;
    document.querySelectorAll(".nav button").forEach(b=>{
      const cur=state.view==="quiz"?"topics":state.view;
      b.classList.toggle("on", b.dataset.go===cur || (state.view==="home"&&b.dataset.go==="home"));
    });
  }catch(err){
    const el=$("#app");
    const msg=String(err && err.stack || err);
    if(el) el.innerHTML='<div class="warnbox"><b>Screen error</b><br>'+msg.replace(/[<>]/g,"")+"</div>";
  }
}
document.querySelector(".nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go==="back"){ goBack(); return; }
  if(b.dataset.go==="drive") startDrive(20);
  else if(b.dataset.go==="topics") go("topics");
  else if(b.dataset.go==="board") go("board");
  else go("home");
});
window.onerror=function(m){const el=$("#app"); if(el) el.insertAdjacentHTML("afterbegin",'<div class="warnbox">'+m+"</div>");};
render();

</script></body></html>

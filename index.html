:root{--bg:#0b1220;--bg2:#121b2e;--card:#17233a;--line:#2a3b5c;--gold:#c9a227;--gold2:#e8c547;--text:#eef3ff;--muted:#9aa8c2;--good:#3dd68c;--bad:#ff6b7a;--safe:env(safe-area-inset-bottom,12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:16px 16px 110px;min-height:100dvh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.badgeimg{width:40px;height:40px;border-radius:10px;border:1px solid var(--gold);background:linear-gradient(160deg,#e8c547,#9a7a18);color:#0b1220;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:-.5px;flex:0 0 40px}
h1{font-size:1.15rem;margin:0}
.sub,.small{color:var(--muted);font-size:.8rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 6px;font-size:.95rem}
.card p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.35}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--gold);color:#14120a;font-weight:700}
.btn.sec{background:var(--bg2);color:var(--text);border:1px solid var(--line)}
.choice{width:100%;text-align:left;margin:0 0 8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}
.choice.good{border-color:var(--good);background:#123326}
.choice.bad{border-color:var(--bad);background:#3a1820}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(11,18,32,.94);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px var(--safe)}
.nav button{background:none;border:0;color:var(--muted);font-size:.7rem;min-width:64px}
.nav button.on{color:var(--gold2)}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:.75rem;color:var(--muted)}
.pill.live{border-color:var(--gold);color:var(--gold2)}
.warnbox{background:#2a220e;border:1px solid #6b5420;border-radius:12px;padding:12px;color:#f3e2a8;font-size:.82rem;line-height:1.4;margin:10px 0}
.ref{background:#10182a;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 14px;color:#c9d6f0;font-size:.82rem;line-height:1.4}.qbox{font-size:1.05rem;line-height:1.45;margin:8px 0 16px}
.explain{background:#102018;border:1px solid #245c3d;border-radius:12px;padding:12px;margin:10px 0;color:#c8f3d8;font-size:.9rem}
.statrow{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.15rem;color:var(--gold2)}
.stat span{font-size:.7rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style>

t more serious after a hospital update. You:", "ch": ["Reclassify and notify per current levels-of-review rules", "Wait for the SBA cycle", "Ask the officer if they mind a bump", "Keep the old box to avoid work"], "a": 0, "ex": "SO6 / SO3 cluster.", "src": "SO6 02-07-23 — use-of-force levels of review and investigative responsibilities.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "pobor", "q": "POBOR is found in:", "ch": ["Manual Volume 1 only", "Government Code 3300–3313", "Penal Code 832", "Evidence Code 1040"], "a": 1, "ex": "GC 3300 et seq.", "src": "California Government Code §§ 3300–3313 (Public Safety Officers Procedural Bill of Rights).", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "pobor", "q": "During a punitive interrogation the officer generally must be informed of:", "ch": ["The nature of the investigation prior to interrogation, and may have a representative present", "The recommended penalty before any questions", "Only the complaint number after the statement is signed", "Nothing if the WC calls it a chat"], "a": 0, "ex": "GC 3303.", "src": "Government Code § 3303 — interrogations; 2026 LT bibliography, POBOR.", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "pobor", "q": "The one-year POBOR investigation clock generally runs from:", "ch": ["The date the Board of Rights is calendared", "The next SBA due date", "The date of hire", "Discovery of the misconduct, subject to statutory exceptions in 3304(d)"], "a": 3, "ex": "Lieutenants own clocks.", "src": "Government Code § 3304(d) — one-year investigation limitations period and listed exceptions.", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "pobor", "q": "A statement compelled under threat of job loss. Garrity generally means:", "ch": ["The statement is a criminal confession once written", "You may skip representation", "POBOR no longer applies", "The compelled statement cannot be used in a criminal prosecution"], "a": 3, "ex": "Garrity v. New Jersey.", "src": "Garrity v. New Jersey, 385 U.S. 493 (1967); pair with Lybarger advisement on compelled statements.", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "pobor", "q": "Locker search without consent, absent a recognized exception, generally needs:", "ch": ["Nothing if the locker is inside the station", "A warrant, the officer present, or notice as GC 3309 provides", "Only the watch commander's radio okay", "Any supervisor hunch that Department property has no privacy"], "a": 1, "ex": "GC 3309.", "src": "Government Code § 3309 — search of lockers and other assigned storage spaces.", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "pobor", "q": "Adverse comments going into a personnel file generally require:", "ch": ["Immediate termination paperwork", "An opportunity to read and sign, and a written response right (GC 3305–3306)", "No notice if a captain wrote it", "Only verbal counseling with no paper"], "a": 1, "ex": "3305-3306.", "src": "Government Code §§ 3305–3306 — adverse comments in personnel files; right to respond.", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "pobor", "q": "PSB wants an interview tomorrow and does not want POBOR to slow it down. You:", "ch": ["Tell the officer to refuse all questions and go home", "Protect notice of the nature of the investigation, representation, recording rules, and Garrity/Lybarger if it is compelled", "Have the officer write a criminal confession on a blank 15.7", "Order the officer in with no representative because they said it is just a witness"], "a": 1, "ex": "Process is the job.", "src": "Government Code § 3303 (interrogation rules) and Garrity/Lybarger if the statement is compelled.", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "ops", "q": "Stolen-vehicle pursuit, 8 minutes, 80 mph on surface streets, no further crime. WC should:", "ch": ["Add units until the car stops because property crime always justifies it", "Wait for a collision before you can terminate", "Stay off the air so the field sergeant owns it", "Take or confirm command, apply the balance test, and terminate if risk outweighs need"], "a": 3, "ex": "WC can terminate from the office.", "src": "SO5 07-01-25 (pursuit initiation / air) and SO6 12-09-25 (DICVS / tracking a pursuit); current Manual pursuit policy.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "Officers following a clearly fleeing violator without calling a pursuit:", "ch": ["Is preferred because it avoids paperwork", "Is not a substitute for initiating a pursuit under listed policy language", "Is required until air arrives", "Converts automatically to a traffic stop"], "a": 1, "ex": "Do not use following as a substitute.", "src": "Current Department pursuit policy (SO5 07-01-25 cluster) — following is not a substitute for a pursuit.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "Command of a pursuit transfers to another Area WC. You must:", "ch": ["Notify Communications, involved units, and any air unit of the transfer", "Assume they heard it on the tac", "Keep both WCs silently in command", "Only note it after the pursuit report"], "a": 0, "ex": "Clear command or you get two ICs.", "src": "Current Manual pursuit policy — transfer of command; notify Communications, units, and air.", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Missing 9-year-old at dusk. First-hour standard is:", "ch": ["Treat as an emergency: resources, search, notifications, and public-alert rules as they apply", "Take a desk report for day watch", "Wait 24 hours because kids run away", "Only broadcast if a parent demands it"], "a": 0, "ex": "Missing-person SO + alerts.", "src": "SO7 03-09-21 — missing and found persons; SO23 12-28-23 — public-alert initiation as applicable.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "School bomb threat / targeted violence. You:", "ch": ["Tweet a shelter-in-place from the Area account", "Leave it to school police exclusively with no LAPD IC", "Send one unit Code 2 and clear if the office thinks it is a prank", "Follow the listed school-threat SO: notifications, campus protocol, do not freelance tactics"], "a": 3, "ex": "SO22 cluster.", "src": "SO22 12-27-23 — bomb threats at schools and threatened targeted mass violence.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "DICVS did not record a pursuit. You:", "ch": ["Close with no video, no pursuit", "Erase remaining video so the package is consistent", "Blame Communications and skip the report", "Treat it as equipment/policy/performance, still complete pursuit documentation, preserve what exists"], "a": 3, "ex": "SO6 12-09-25 + pursuit package.", "src": "SO6 12-09-25 — DICVS use and tracking a pursuit.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "Impound because the driver was rude. You:", "ch": ["Skip inventory if the driver is present", "Approve it to back the officer", "Require a lawful community-caretaking or statutory basis under current SO/Manual", "Always 30-day hold for attitude"], "a": 2, "ex": "SO14.", "src": "SO14 07-30-21 — Community Caretaking Doctrine and vehicle impound procedures.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "Hate / prejudice incident reporting (SO7 12-16-25). WC standard is:", "ch": ["Proper classification, required reporting, resource pamphlet, notifications — not just a 415", "Treat speech you dislike as the crime without elements", "Only take it if a detective is on duty", "Close as advice given if nobody wants a report"], "a": 0, "ex": "Classification + pamphlet.", "src": "SO7 12-16-25 — reporting incidents motivated by hatred or prejudice.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "sUAS request on a search. You:", "ch": ["Skip logging if the search is short", "Use the approved program path and log under the listed SO — not a private drone", "Have an officer launch a personal drone off the hood", "Deny all air because ICS hates robots"], "a": 1, "ex": "SO4 06-24-25.", "src": "SO4 06-24-25 — Small Unmanned Aerial System program deployment guidelines.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "High-risk stop based solely on belief a car might be stolen, no other facts. You:", "ch": ["Skip air and a supervisor because speed matters more", "Turn BWV off until the car is empty", "Do not treat a hunch as a high-risk felony stop; need current legal/tactical basis", "Always gunpoint every possible 10851"], "a": 2, "ex": "08-16-24 bibliography item.", "src": "2026 LT bibliography field-operations item on high-risk vehicle stops; current Manual / 4th Amendment.", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "con", "q": "Miranda attaches when both exist:", "ch": ["A traffic stop and a name check", "Any field interview and a notebook", "Custody and interrogation", "An audience and a camera"], "a": 2, "ex": "Both prongs.", "src": "Miranda v. Arizona, 384 U.S. 436 (1966); SO1 01-14-21 (Miranda / WIC 625 cluster).", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "con", "q": "A juvenile in custody is being questioned about a crime. Check:", "ch": ["Nothing if a parent is on the way tomorrow", "Miranda plus current WIC 625 juvenile advisement rules", "Only the booking number", "Adult Miranda only; kids have no extra advisement"], "a": 1, "ex": "SO1 / SO2 WIC 625 cluster.", "src": "SO1 01-14-21 and SO2 06-11-24 — Miranda plus WIC § 625 juvenile advisement.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "con", "q": "Terry frisk requires reasonable suspicion the person is:", "ch": ["Armed and dangerous", "In a high-crime area only", "On probation", "Rude during the stop"], "a": 0, "ex": "Separate stop from frisk.", "src": "Terry v. Ohio, 392 U.S. 1 (1968) — stop versus frisk.", "url": "https://supreme.justia.com/cases/federal/us/490/386/"}, {"topic": "con", "q": "Pretext-stop limitations are on the bibliography so you:", "ch": ["Order BWV off to reset the stop", "Apply current Department limits, not old any-equipment-violation folklore", "Treat every tint stop as a narcotics investigation automatically", "Ignore SO3 because traffic always justifies a full search"], "a": 1, "ex": "SO3 03-09-22.", "src": "SO3 03-09-22 — limitation on the use of pretextual stops.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "con", "q": "A traffic stop is a seizure under which amendment?", "ch": ["Second", "Tenth", "Fourth", "First"], "a": 2, "ex": "Stops, detentions, arrests, most force.", "src": "Fourth Amendment; Whren / Rodriguez line; Department stop policy.", "url": "https://supreme.justia.com/cases/federal/us/490/386/"}, {"topic": "con", "q": "Lawful public recording of police should generally be:", "ch": ["A felony if they cuss", "Allowed; do not retaliate or seize as punishment", "Automatic grounds for detention", "Stopped by spraying the camera"], "a": 1, "ex": "First Amendment / civil unrest video cluster.", "src": "First Amendment; SO2 01-12-23 civil-unrest / videographer cluster; current Manual.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "sup", "q": "VWE supervisory capacity means:", "ch": ["Full-time line responsibility: assign work, review work, and complete rating reports", "Writing a single 15.7 about another squad", "Being senior at one crime scene", "Having a radio and a stripe"], "a": 0, "ex": "Personnel definition on the form.", "src": "City of Los Angeles Personnel / VWE instructions — definition of supervisory capacity.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "sup", "q": "Employee reports sexual harassment by a popular supervisor. You:", "ch": ["Investigate off the books and keep no paper", "Receive it, protect from retaliation, route per EEO/complaint policy, notify command", "Tell them not to ruin a career over a joke", "Confront the accused at roll call for sport"], "a": 1, "ex": "Retaliation SO / EEO.", "src": "SO9 05-22-12 — policy prohibiting retaliation; Department EEO / complaint procedures.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "sup", "q": "Best sergeant is exploding overtime with unplanned holds. You:", "ch": ["Ignore MOU/fatigue issues until a grievance lands", "Get the numbers, reset expectations, plan staffing, document, brief the captain", "Keep holding silently to make the board", "Blame the officers for having kids"], "a": 1, "ex": "Supervision + MOU.", "src": "MOU 24 (or current LAPPL MOU) plus Department overtime / fatigue and supervision standards.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "sup", "q": "SBA is primarily used to:", "ch": ["Hide misconduct until the rating year ends", "Replace all 1.28 investigations", "Pay only", "Document performance against standards, develop people, and support personnel decisions"], "a": 3, "ex": "Performance system.", "src": "Department Standards Based Assessment / performance evaluation system — Manual / Personnel rules.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "sup", "q": "BWV/DICVS supervisory review means a lieutenant:", "ch": ["Audits video for policy, tactics, and professionalism — not hope", "Deletes video that is inconvenient", "Only watches video after a lawsuit", "Lets officers self-certify activation"], "a": 0, "ex": "Supervisory review notice.", "src": "SO6 12-09-25 — DICVS use and tracking a pursuit.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ics", "q": "Span of control is generally:", "ch": ["Two chiefs per officer", "Unlimited if you have a cell phone", "1:20 on civil unrest because everyone can hear the tac", "About 3–7 subordinates, optimally near 5; branch if it breaks"], "a": 3, "ex": "ICS.", "src": "ICS / NIMS — FEMA ICS-100/200; 2026 LT bibliography incident-command knowledge area.", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "ics", "q": "You arrive at a growing incident. First:", "ch": ["Get a briefing and either assume command cleanly or support the current IC", "Wait for the captain before any radio", "Create a second silent command from your car", "Run to the most exciting corner"], "a": 0, "ex": "Arrival ritual.", "src": "ICS / NIMS transfer/assumption of command; 2026 LT bibliography.", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "ics", "q": "Unified Command is for:", "ch": ["Any time a sergeant wants a second radio", "Only when the mayor arrives", "Replacing ICS functions with a press conference", "More than one agency/jurisdiction with significant authority at the same incident"], "a": 3, "ex": "ICS/NIMS.", "src": "ICS / NIMS — Unified Command when more than one agency has significant authority.", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "pj", "q": "Four pillars of procedural justice:", "ch": ["Speed, stats, arrests, overtime", "Rank, time, power, silence", "Force, numbers, media, fear", "Voice, neutrality, respect, trustworthiness"], "a": 3, "ex": "Bulletin knowledge area.", "src": "2026 Lieutenant bulletin knowledge area — procedural justice (voice, neutrality, respect, trustworthiness).", "url": "https://www.lapdonline.org/community-inquiries-on-lapd-training-and-practice/"}, {"topic": "pj", "q": "A pattern of stops that looks like pretext fishing. You:", "ch": ["Wait for Inspector General", "Tell them to turn BWV off on the next one", "Apply current pretext limits, audit BWV, coach or complaint as the facts require", "Praise the numbers only"], "a": 2, "ex": "Biased policing + pretext SOs.", "src": "SO3 03-09-22 — limitation on the use of pretextual stops.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "mou", "q": "A grievance hits the WC desk. Best first move:", "ch": ["Follow contractual steps and timelines; try to resolve at the lowest appropriate level; document", "Send it to the Chief the same night skipping steps", "Tear it up as insubordination", "Ignore it until it disappears"], "a": 0, "ex": "MOU 24 process competence.", "src": "Current LAPPL MOU grievance procedure (MOU 24 or successor) — lowest appropriate level and timelines.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "mou", "q": "Secondary employment while on sick/IOD/TTD is:", "ch": ["Encouraged to keep them busy", "A private matter you never document", "Always fine if they use a different name", "Restricted by listed 2023 SOs; supervisors must know and act"], "a": 3, "ex": "SO8/SO13.", "src": "SO8 / SO13 2023 — secondary employment and strenuous activity while sick, IOD, or TTD.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "crime", "q": "Last period 80 burglaries, this period 100. Percent change is:", "ch": ["80% increase because 80 was last period", "25% increase", "20% increase (raw count change treated as percent)", "20 percentage points, therefore 20%"], "a": 1, "ex": "(100-80)/80 = 25%.", "src": "Crime-analysis percent change: (new − old) / old. 2026 LT exam quantitative / crime-stats area.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "Air unit is up and the ground unit is still calling a stolen for a 15-minute surface pursuit with no further crime. Best WC move:", "ch": ["Apply the balance test and terminate if risk outweighs need even if air is up", "Stay off the air so air owns command", "Add spike strips on every block automatically", "Keep it going because air is now covering liability"], "a": 0, "ex": "Air does not cancel the balance test.", "src": "SO5 07-01-25 and current Manual pursuit policy — air does not cancel the balance test.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "ops", "q": "Two sergeants are both giving pursuit orders on different tacs. You:", "ch": ["Let both keep talking so nobody feels overruled", "Wait until the car stops", "Establish one IC, announce command, kill the dual-command problem", "Tell Communications to ignore both"], "a": 2, "ex": "One IC.", "src": "Current Manual pursuit / ICS command policy — one incident commander.", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "uof", "q": "Hobble is on and the suspect is face-down in the back seat complaining they cannot breathe. You:", "ch": ["Leave them prone until jail", "Sit them up or use an approved position, get medical, follow SO25 / current Manual", "Remove the hobble and release them on the sidewalk", "Tell them they are lying because they can talk"], "a": 1, "ex": "Position + medical.", "src": "SO25 12-14-21 — positional asphyxia, hobble restraint, transporting injured suspects.", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "pobor", "q": "Officer asks for a representative and the investigator says we do not have time. You:", "ch": ["Cancel the whole investigation", "Order the officer to answer now or be insubordinate", "Hav casts until day watch", "Wait for media or the captain before any notification", "Apply the current Manual/SO text, notify, and document — do not invent a shortcut", "Handle it as a comment card and close it at the desk"], "a": 2, "ex": "Current text beats folklore.", "src": "SO7 12-16-25 — 2026 Lieutenant Examination bibliography. Confirm current Manual text (Q1 2026 Manual controls conflicts).", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "One of the Police Department’s missions during an air crash is to support the Incident Commander by providing all of the following EXCEPT:", "ch": ["Control of emergency vehicle ingress/egress routes", "Perimeter and traffic controls", "Crash site security", "Recovery and identification of the dead", "Preservation of evidence"], "a": 3, "ex": "Recovery and identification of the dead is not listed as an LAPD air-crash support mission.", "src": "FOG p.4 — Scope of Police Department involvement", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "What Department entity directs the Department’s investigation at an air crash?", "ch": ["Bureau Traffic Supervisor", "Divisional Detective Commanding Officer", "EOD Commanding Officer", "DVSD Investigator"], "a": 2, "ex": "EOD Commanding Officer directs the Department investigation.", "src": "FOG p.4 — Area Watch Commander / Incident Commander Responsibilities", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Third-party negotiations are recommended during an attempted suicide until a Crisis Negotiator responds.", "ch": ["True", "False"], "a": 1, "ex": "False — third-party negotiations are not recommended.", "src": "FOG p.7 last paragraph", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Which is NOT one of the four “C’s” of a tactical response?", "ch": ["Containment", "Control", "Command", "Communications", "Coordinate"], "a": 4, "ex": "The four C’s are Containment, Control, Command, and Communications.", "src": "FOG pp.8–9", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "You respond to a bomb-threat radio call and a possible device is found. How far do you evacuate the surrounding area?", "ch": ["500 feet", "400 feet", "300 feet", "200 feet"], "a": 2, "ex": "Evacuate 300 feet.", "src": "FOG p.11", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "At a bomb-threat radio call, who determines if a search is to be conducted?", "ch": ["Person in charge of the location", "Senior officer", "Watch Commander", "Bomb Squad Supervisor"], "a": 0, "ex": "Person in charge of the location decides whether to search.", "src": "FOG p.12 ¶5", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "If a device is found at a location, who has responsibility to evacuate that location?", "ch": ["Person in charge of the location", "Senior officer", "Watch Commander", "Bomb Squad Supervisor"], "a": 0, "ex": "Person in charge of the location.", "src": "FOG p.13 ¶2", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Are media members allowed to enter a bomb scene area?", "ch": ["Yes", "No"], "a": 1, "ex": "No.", "src": "FOG p.13 ¶5", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Which is NOT a Crowd Management objective?", "ch": ["Establish contact with the crowd and the formal leader", "Obtain voluntary compliance with police directives", "Minimize enforcement actions", "Arrest violators"], "a": 3, "ex": "Arresting violators is a crowd-control, not crowd-management, objective.", "src": "FOG p.16 ¶1", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "“Restore conditions to normal as rapidly and efficiently as possible” is the definition of the Department’s:", "ch": ["Crowd Management Mission", "Crowd Control Mission", "General Principles of Crowd Management", "General Principles of Crowd Control"], "a": 1, "ex": "That wording is the Crowd Control Mission.", "src": "FOG p.16 ¶2", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Objectives that must be addressed to accomplish the crowd-control mission include all EXCEPT:", "ch": ["Protect life", "Protect vital facilities", "Arrest violators", "Restore and maintain order", "Establish contact with the crowd", "Protect property"], "a": 4, "ex": "Establish contact with the crowd is a management objective, not a control objective.", "src": "FOG p.16 ¶2", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "All of the following are General Principles of Crowd Management EXCEPT:", "ch": ["Establish contact with the crowd", "Control of personnel", "Separate opposing factions", "Gather intelligence", "Knowledge of previous events", "Contain and isolate", "Alternate location of assembly"], "a": 5, "ex": "Contain and isolate is a crowd-control principle.", "src": "FOG pp.16–17", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "All of the following are General Principles of Crowd Control EXCEPT:", "ch": ["Rapid mobilization and deployment", "Contain and isolate", "Gather intelligence", "Secure critical or sensitive locations", "Disperse and discourage disorderly groups", "Provide protection to City agencies or utilities", "Return to normalcy"], "a": 2, "ex": "Gather intelligence is a management principle.", "src": "FOG pp.17–18", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "A damage assessment (windshield survey) must be provided to DOC or Bureau Command within how long after an earthquake?", "ch": ["30 minutes", "One hour", "Two hours", "20 minutes"], "a": 0, "ex": "30 minutes.", "src": "FOG p.20", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "On a General Survey Report the color Amber represents:", "ch": ["Little sign of apparent impact", "Major problems in the Reporting District", "Severe damage and life-threatening situations", "Signs of impact to people and structures; impact appears minor"], "a": 3, "ex": "Amber = signs of impact; impact appears minor.", "src": "FOG p.24", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "An evacuation warning should include all EXCEPT:", "ch": ["Type of evacuation (voluntary or mandatory)", "Best available routes out of the area", "Location of evacuation centers", "Command post location", "Anticipated duration of the emergency", "Time remaining before the situation becomes critical"], "a": 3, "ex": "Command post location is not part of the public warning list.", "src": "FOG p.28", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "At a fire the Police Incident Commander can establish a:", "ch": ["Law Branch within the Operations Section", "Logistics Branch within the Operations Section", "Safety Officer only", "Communications Officer only"], "a": 0, "ex": "Law Branch inside Operations.", "src": "FOG p.31", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Laboratories confirmed by hazmat technicians to be used solely for narcotics production will be investigated by:", "ch": ["NED", "LA Impact", "Hazardous Materials Unit", "MCD"], "a": 0, "ex": "NED.", "src": "FOG p.33", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Isolation distance required for a chemical odor or dispersal agent (intentional or accidental) is:", "ch": ["600 feet", "300 feet", "50 feet", "250 feet"], "a": 1, "ex": "300 feet.", "src": "FOG p.35", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Which of the following is NOT a nerve agent?", "ch": ["Tabun", "Mustard gas", "Sarin", "Soman"], "a": 1, "ex": "Mustard is a blister agent, not a nerve agent.", "src": "FOG p.36", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Protection from radiation can be simplified to Time, Distance, and:", "ch": ["Space", "Area", "Shielding", "Size"], "a": 2, "ex": "Time, Distance, Shielding.", "src": "FOG p.37", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "A technician in Unified Command designates three hazmat operations areas. Which is NOT one of them?", "ch": ["Hot Zone / Exclusion Zone", "Warm Zone / Contamination Reduction Zone", "Cold Zone / Support Zone", "Frozen Zone / Debrief Zone"], "a": 3, "ex": "There is no Frozen Zone.", "src": "FOG p.38", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "An officer can use force or arrest a victim who may have been contaminated and wants to leave without being decontaminated.", "ch": ["True", "False"], "a": 1, "ex": "False.", "src": "FOG p.39", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Police cannot restrict news media from a hazardous-material crime scene.", "ch": ["True", "False"], "a": 1, "ex": "False — media can be restricted at a hazmat crime scene.", "src": "FOG p.40", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Every police officer and supervisor who responds to a homicide scene and is assigned a task or enters the crime scene must complete a detailed Officer’s Statement Form after leaving the scene.", "ch": ["True", "False"], "a": 0, "ex": "True.", "src": "FOG p.42", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "How is the primary Division determined in a missing-person investigation?", "ch": ["Location last seen", "Location the person is going", "Missing person’s primary address", "Division that takes the initial report"], "a": 2, "ex": "Primary address.", "src": "FOG p.48", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "At an air crash the Area Watch Commander shall notify the Area Commanding Officer and obtain approval for a Size-Up.", "ch": ["True", "False"], "a": 1, "ex": "False.", "src": "FOG p.4", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "At an air crash LAPD is the initial lead agency in the Unified Command.", "ch": ["True", "False"], "a": 1, "ex": "False.", "src": "FOG p.4", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Who is called to remove a small aircraft from traffic ways?", "ch": ["OPG Tow", "FAA", "Bureau of Street Maintenance", "CHP"], "a": 2, "ex": "Bureau of Street Maintenance.", "src": "FOG p.5", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Does a barricaded suspect meet the criteria for deployment of the UPR?", "ch": ["Yes", "No"], "a": 0, "ex": "Yes.", "src": "FOG p.9", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Upon responding to a bomb-threat radio call an officer shall turn off all radio transmission.", "ch": ["True", "False"], "a": 1, "ex": "False — do not automatically kill all radio.", "src": "FOG p.12", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "An officer can arrest a person for refusing to evacuate a bomb-threat scene under what authority?", "ch": ["148(a) PC", "69 PC", "409.5 PC", "242 PC"], "a": 2, "ex": "409.5 PC.", "src": "FOG p.13", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "It is Department policy to use crowd ______ strategies and tactics whenever possible to keep a lawful crowd from becoming an unlawful assembly or riot.", "ch": ["Management", "Control"], "a": 0, "ex": "Crowd management first.", "src": "FOG p.15", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Which is NOT an Area Watch Commander responsibility hich may tend to reflect unfavorably upon the employee or the Department", "A delay in service"], "a": 4, "ex": "A delay in service, standing alone, is not misconduct and generally does not start a 1.28.", "src": "Manual 3/805.25 and 3/810.05", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "A complaint shall not be initiated for delay in service, a low-flying airship, a disputed traffic citation, or an inmate complaint about accommodations.", "ch": ["True", "False"], "a": 0, "ex": "True — those are listed exceptions.", "src": "Manual 3/810.05", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Which of the following complaints must be tape-recorded during the interview?", "ch": ["FTA", "FTQ", "PTC", "None of the above"], "a": 3, "ex": "Recording is not mandatory for Department-initiated minor misconduct such as FTA, FTQ, and PTC.", "src": "Manual 3/810.05 Exception", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Which of the following are considered high-grade misdemeanors?", "ch": ["Indecent exposure", "Child molesting", "Contributing", "Petty theft", "Lewd conduct", "All of the above"], "a": 5, "ex": "All listed items are high-grade misdemeanors.", "src": "Manual 3/837.10 Note", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Non-Disciplinary complaints require a Letter of Transmittal.", "ch": ["True", "False"], "a": 1, "ex": "False. Non-Disciplinary complaints do not require a LOT.", "src": "Manual 3/831.10", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Who must an employee notify when obtaining an EPO for workplace violence involving a City employee as the protected person?", "ch": ["Legal Affairs Unit", "Robbery-Homicide Division", "Internal Affairs Group", "Threat Management Unit, DSVD", "None of the above"], "a": 3, "ex": "TMU, Detective Support and Vice Division.", "src": "Manual 3/891 Note", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Who should a supervisor contact for advice before releasing legally protected or intelligence information to the Office of the Inspector General?", "ch": ["The Area CO", "The Bureau CO", "Internal Affairs Group", "Legal Affairs", "Chief of Staff"], "a": 4, "ex": "Chief of Staff.", "src": "Manual 3/895", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Who is responsible for auditing the Department e-mail system?", "ch": ["Internal Affairs Group, Special Operations Division", "Audit Division", "Office of the Inspector General", "Communications Division"], "a": 1, "ex": "Audit Division audits WAN / e-mail activity Department-wide.", "src": "Manual 4/105.15", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The Air Support Division Air Operations / Downlink Vehicle, when assigned to a command post, shall be designated “2D100.”", "ch": ["True", "False"], "a": 0, "ex": "True.", "src": "Manual 4/110.40 Note", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Policy consists of principles and values which guide Department activity. Policy is:", "ch": ["Situation-oriented and must list every step", "Objective rather than situation-oriented and stated in general terms", "The same thing as a rule", "A specific prohibition with no exceptions"], "a": 1, "ex": "Policy is objective, not situation-oriented, and is stated in general terms.", "src": "Manual 1/010", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "A rule is:", "ch": ["A desired end for which effort is expended", "A method of performing an operation", "A specific prohibition or requirement that allows little deviation other than stated exceptions", "A quality of performance or accomplishment"], "a": 2, "ex": "Manual 1/020.50.", "src": "Manual 1/020.50", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Reverence for human life is the primary consideration in developing tactics. No arrest, conviction, or piece of evidence can outweigh:", "ch": ["Public approval", "The value of human life", "The primary objective of CompStat", "Recovery of property"], "a": 1, "ex": "Manual 1/130.25.", "src": "Manual 1/130.25", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "A “Staff Officer” is an officer:", "ch": ["In charge of a watch", "Above the rank of captain", "In charge of a section or unit", "Who takes command of an emergency"], "a": 1, "ex": "Staff Officer = above captain.", "src": "Manual 3/105", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "When the Office of the Chief of Police is closed, the Department Command Post is:", "ch": ["DOC", "Communications Division", "RACR", "The Area watch commander"], "a": 2, "ex": "RACR.", "src": "Manual 3/108.20", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The senior officer at a police incident is determined by:", "ch": ["Time on scene, then rank", "Rank, then paygrade within rank, then seniority within paygrade", "Detective status first", "Who requested the call"], "a": 1, "ex": "Rank, then paygrade, then seniority. Detectives are normally separate from line command.", "src": "Manual 3/125", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Supervisors may delegate portions of their duties and equivalent authority, but they may not delegate:", "ch": ["Training", "Overall responsibility for results or any portion of their accountability", "Roll-call inspection", "FI review"], "a": 1, "ex": "Accountability stays with the supervisor.", "src": "Manual 3/154.20", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Negative discipline shall be used only after determining that correction by positive disciplinary means is:", "ch": ["Too slow", "Not feasible", "Requested by the employee", "Directed by IAG"], "a": 1, "ex": "Manual 3/156.80.", "src": "Manual 3/156.80", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Pursuit-related reports go to the bureau commanding officer within:", "ch": ["10 calendar days", "14 calendar days", "20 calendar days", "30 calendar days"], "a": 2, "ex": "20 calendar days of the pursuit.", "src": "Manual 3/201.05", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "When training is directed after a pursuit, the Area/division CO shall ensure it is completed within:", "ch":

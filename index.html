OST"], "a": 1, "ex": "Admin transfer; no driving and no return for one year. COP retains final transfer authority.", "src": "Manual 3/207.95", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Watch Commanders may start 15 minutes early to prepare for roll call. Extra time requires:", "ch": ["No approval", "Immediate supervisor approval only", "Commanding officer approval", "Bureau approval"], "a": 2, "ex": "Any additional time requires CO approval.", "src": "Manual 3/222.20", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The watch commander shall remain present during:", "ch": ["The first five minutes of roll call", "The entire roll call period", "Inspection only", "Dismissal only"], "a": 1, "ex": "Entire roll call.", "src": "Manual 3/222.30", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Area/division/Department orders that might affect the watch shall be read at roll call for:", "ch": ["One day", "Three consecutive days", "Five consecutive days", "One DP"], "a": 2, "ex": "Five consecutive days. Note watch, reader name/serial, and date on the face of the order.", "src": "Manual 3/222.45", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "When a watch commander will be absent, he or she shall:", "ch": ["Leave the desk officer in charge automatically", "Designate a qualified subordinate to assume WC duties", "Notify RACR only", "Close the watch"], "a": 1, "ex": "Manual 3/230.95.", "src": "Manual 3/230.95", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "ICS shall be the primary incident-management tool utilized by the Department.", "ch": ["True", "False"], "a": 0, "ex": "True.", "src": "EOG Vol. 4 Command Officer’s Guide", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "man", "q": "ICS priorities, in order, are:", "ch": ["Property, life, stabilization", "Life safety, incident stabilization, property preservation", "Arrest, evidence, press", "Containment, control, command"], "a": 1, "ex": "Life, then stabilize, then property.", "src": "EOG Vol. 4 / ICS", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "man", "q": "The five major ICS functional areas (COPLA) are:", "ch": ["Command, Operations, Planning, Logistics, Administration/Finance", "Containment, Operations, Patrol, Logistics, Air", "Command, Operations, Press, Legal, Admin", "Control, Ops, Planning, Law, After-action"], "a": 0, "ex": "COPLA.", "src": "EOG Vol. 4", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "man", "q": "ICS span of control of any supervisor should range from:", "ch": ["Two to four", "Three to seven", "Five to ten", "One to three"], "a": 1, "ex": "Three to seven.", "src": "EOG Vol. 4 — Essential Features of ICS", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "man", "q": "Incidents are spontaneous; events are:", "ch": ["Always larger", "Pre-planned", "Always multi-agency", "Always declared unusual occurrences"], "a": 1, "ex": "EOG Vol. 4.", "src": "EOG Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Who investigates Categorical Uses of Force?", "ch": ["Area CO", "FID", "UOF Review Division only", "The Watch Commander"], "a": 1, "ex": "Force Investigation Division investigates all aspects of CUOF, with listed exceptions.", "src": "Manual 3/794.10", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "FID shall complete a CUOF In-Custody Death investigation unless ALL of the listed natural-death conditions exist, including Coroner preliminary determination of natural/accidental/undetermined, no UOF, no misconduct, no policy violation that led to the death, tox supports Coroner, and no seriously conflicting statements.", "ch": ["True", "False"], "a": 0, "ex": "True — all conditions must exist to reclassify off the CUOF track.", "src": "Manual 3/794.10 ICD", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "A suspect may be transported to a victim or witness for field ID when a preliminary investigation requires it AND probable cause exists, OR exigent circumstances make transporting the victim/witness unreasonable, OR the suspect consents.", "ch": ["True", "False"], "a": 0, "ex": "True. Also give the three advisements to the victim/witness.", "src": "Manual 4/203.50", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Officers must handcuff a person with mental illness taken into custody when the person is not restrained by a straitjacket or restraining straps.", "ch": ["True", "False"], "a": 0, "ex": "True.", "src": "Manual 4/217.36", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Uniformed personnel shall not maintain or use confidential informants. They shall contact a non-uniformed investigative employee as soon as practical.", "ch": ["True", "False"], "a": 0, "ex": "True.", "src": "Detective Bureau Notices — confidential informants", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Critical missing adult includes suicidal, immediate medical need including Alzheimer’s/dementia, elderly who cannot care for themselves, or disappeared under unusual circumstances. Adults are handled by:", "ch": ["Area Juvenile Detectives", "MPU, DSVD", "FID", "RACR only"], "a": 1, "ex": "Missing Persons Unit, DSVD. Ping through MCD if there is a cell phone.", "src": "Detective Bureau Notices — Critical Missing Adults", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Brevet (acting) ranks shall not be used. An officer assigned to a higher function shall be described by:", "ch": ["The acting title only", "His or her Civil Service rank, indicating the acting position held", "The paygrade of the vacant spot", "Whatever Communications broadcasts"], "a": 1, "ex": "Example: Lieutenant John Doe, Acting Commanding Officer.", "src": "Manual 3/120", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Functional supervision is:", "ch": ["Permanent command of another unit", "Temporary supervision of employees not normally under one’s command to furnish specialized or technical knowledge", "The same as line supervision", "Supervision only of civilians"], "a": 1, "ex": "Temporary + specialized/technical knowledge.", "src": "Manual 3/140", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "CTSOB has final review of all vehicle pursuits and may delegate in-policy, non-conflicting pursuits to:", "ch": ["Area CO", "CO, EOD", "IAG", "Training Division"], "a": 1, "ex": "CO EOD may take in-policy pursuits that do not conflict with bureau classification.", "src": "Manual 3/201.15", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "CO, EOD shall make the final pursuit classification within how many calendar days of receipt?", "ch": ["14", "20", "30", "90"], "a": 2, "ex": "30 days, with an extra 30 if more investigation is documented in the file.", "src": "Manual 3/201.20", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Citation books not completed within three months after issuance shall be:", "ch": ["Destroyed", "Recalled and reissued to more enforcement-active employees", "Kept by the original officer", "Sent to Traffic Court"], "a": 1, "ex": "90 days / three months.", "src": "Manual 3/202.24", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "A Fleet Safety Peer Review Board reviews minor collisions involving lieutenants and below and shall consist of:", "ch": ["Three captains", "Two members of equal Civil Service rank and a supervisor at least one rank above", "Only Training Division", "The Bureau CO only"], "a": 1, "ex": "2 peers + 1 supervisor at least one rank above.", "src": "Manual 3/207.10", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The Executive Fleet Safety Committee reviews collisions involving LTs and below that result in:", "ch": ["Any property damage", "A or K injuries", "Parking hits only", "Off-duty collisions only"], "a": 1, "ex": "A or K injuries.", "src": "Manual 3/207.30", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "An employee appealing a preventable T/C finding or point value shall submit a 15.7 to the Department Traffic Coordinator within:", "ch": ["10 calendar days", "20 calendar days", "30 calendar days", "One DP"], "a": 1, "ex": "One appeal per incident. Reviewing Officer decision is final.", "src": "Manual 3/207.62", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Employees shall log on and acknowledge electronic subpoenas and cancellations at least:", "ch": ["Once per week", "Once per workday", "Once per DP", "Only when SCO calls"], "a": 1, "ex": "Once per workday. WC enforces it.", "src": "Manual 3/210.02", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The five discretionary watch assignment pools include Lieutenants I/Watch Commanders, Sergeant II/AWC, probationary Sergeant I, traffic trainees, and:", "ch": ["All Sergeant I", "Police Officers I", "Only detectives", "SLOs"], "a": 1, "ex": "PO I is the fifth discretionary pool.", "src": "Manual 3/222.02", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Senior officers in each non-supervisory primary watch pool shall not exceed what percent of that pool?", "ch": ["4 percent", "10 percent", "15 percent", "50 percent"], "a": 2, "ex": "15 percent. Separately, PO II/III with 20+ years, not to exceed 4 percent of those ranks, get watch choice.", "src": "Manual 3/222.02", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Watch seniority continues during sick, IOD, leave, and vacation, but does not accrue during military activation in excess of:", "ch": ["One day", "One DP", "30 days", "One year"], "a": 1, "ex": "More than one DP of military activation stops seniority accrual.", "src": "Manual 3/222.02", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Primary-pool employees become eligible to be bumped after how many full consecutive DPs on the same watch?", "ch": ["3", "6", "9", "12"], "a": 1, "ex": "Six full consecutive DPs. Discretionary pools: three.", "src": "Manual 3/222.02", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Deployment (DWS) shall be transmitted to Communications no later than:", "ch": ["Start of watch", "15 minutes prior to clearance", "30 minutes prior to clearance time", "End of roll call"], "a": 2, "ex": "30 minutes prior to clearance.", "src": "Manual 3/224.10", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "A serious occupational injury/illness for OSHA purposes includes inpatient hospitalization over 24 hours (other than observation), loss of a body member, or serious permanent disfigurement. The Area WC must immediately notify RACR of an occupationally related death or life-threatening injury.", "ch": ["True", "False"], "a": 0, "ex": "True. Form 5020 to Medical Liaison within 24 hours.", "src": "Manual 3/275.10", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Every worksite housing more than how many personnel must have a Building Emergency Coordinator and a disaster plan?", "ch": ["5", "10", "15", "25"], "a": 1, "ex": "More than 10.", "src": "Manual 3/279", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Before releasing CORI, the employee must determine the requester’s:", "ch": ["Rank only", "Right to know and need to know", "Friendship with the subject", "Press credential"], "a": 1, "ex": "Right to know and need to know.", "src": "Manual 3/408.16", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "uof", "q": "Final administrative reports of OIS, ICD, upper-body control hold, UOF death, UOF hospitalization, head strike with an impact weapon, and K-9 bite with hospitalization shall be marked:", "ch": ["Public record", "Confidential", "Training only", "CompStat"], "a": 1, "ex": "CO FID retains original; copies to OIG, LAD, UOFRB.", "src": "Manual 3/409.20", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "uof", "q": "The 72-Hour Brief is:", "ch": ["The Board of Rights packet", "The briefing for the COP and concerned command staff on preliminary CUOF information", "The employee’s Skelly", "The press release"], "a": 1, "ex": "Manual 3/792.", "src": "Manual 3/792", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "uof", "q": "The COP shall submit CUOF recommended administrative findings to BOPC by the admin statute deadline, which is:", "ch": ["The one-year date", "60 calendar days prior to the administrative statute date", "30 days after FID closes", "14 days after the 72-hour brief"], "a": 1, "ex": "Statute is generally one year from report to a supervisor, unless tolled.", "src": "Manual 3/792.06", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "pobor", "q": "If an employee declines to waive Miranda and the administrative interview must continue, the investigator shall read the administrative admonition that silence can be deemed insubordination and that compelled statements cannot be used in a later criminal case.", "ch": ["True", "False"], "a": 0, "ex": "Lybarger / administrative admonition.", "src": "Manual 3/820.15", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "ops", "q": "A Code Five Edward notifies Air Support of an explosive hazard to low-altitude aircraft. Radio or MDT should be used about how far from the location?", "ch": ["50 feet", "100 feet", "One block / about 500 feet", "One mile"], "a": 2, "ex": "Also give CD the location and perimeter in feet.", "src": "Manual 4/120.40 Code Five Edward", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "An officer may initiate Code Three when an emergency exists, including a serious public hazard, immediate pursuit, preservation of life, serious crime in progress, prevention of a serious crime, or another unit requested Code Three.", "ch": ["True", "False"], "a": 0, "ex": "Supervisors manage and can shut down extra Code Three after Code Four.", "src": "Manual 4/120.40 Code Three", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Hearing-impaired calls from Communications must be contacted within:", "ch": ["15 minutes", "30 minutes", "One hour", "End of watch"], "a": 2, "ex": "Log on the STORM log. If you cannot finish in an hour, call back with an ETA.", "src": "Manual 4 — hearing-impaired / STORM", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Officers shall obtain a DR number within two hours of determining that a Missing/Found Persons Investigation will be completed for any missing person.", "ch": ["True", "False"], "a": 0, "ex": "Also NCIC/DOJ within two hours. Under 21 entered as a juvenile.", "src": "Manual 4/712", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "An Amber Alert requires confirmed abduction; victim 17 or younger or confirmed mental/physical disability; reasonably believed in imminent danger of SBI or death; and sufficient information that, if publicized, could help recovery.", "ch": ["True", "False"], "a": 0, "ex": "Not for runaways, missing-without-foul-play, or custody disputes that are not life-endangering. Request through RACR.", "src": "Manual 4/712.20", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "A Blue Alert requires a LE officer killed, SBI, or assaulted with a deadly weapon; suspect fled; imminent threat; detailed vehicle or plate; and public info may help avert further harm. RHD notifies RACR; RACR requests through CHP.", "ch": ["True", "False"], "a": 0, "ex": "All conditions must be met.", "src": "Manual 4/760.20", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Employees must never ask an arrestee or detainee about their legal status in the United States.", "ch": ["True", "False"], "a": 0, "ex": "Manual note on immigration status questions.", "src": "Manual Vol. 4 note", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Narcotics-related currency that appears to exceed $10,000 shall not be disturbed or counted. Notify a lieutenant or acting WC and AFID.", "ch": ["True", "False"], "a": 0, "ex": "WC responds. Photograph in place. Extra copy of reports to Asset Forfeiture, GND.", "src": "Manual 4/201.65", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Hate crime vs hatred incident: a hatred incident is non-criminal (epithets, posted material with no damage). A hate crime is a criminal act or attempt based on protected status. Complete an IR even if the victim will not sign.", "ch": ["True", "False"], "a": 0, "ex": "Notify WC and RACR; check Motivated by Hatred/Prejudice. WC sends copies to the Hate Crime Coordinator (Area Detective CO).", "src": "Manual 4 — Hate Crime", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "A lieutenant or above shall be present at execution of search warrants where GED/CLEAR personnel are involved in the service.", "ch": ["True", "False"], "a": 0, "ex": "Supervisor at each location; lieutenant coordinates multi-location. Not required if GED is support-only.", "src": "Manual 4/742.30", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "A supervisor shall be present for all warrant services that require a Tactical Plan Report. GPS-only or third-party records warrants do not require a Tactical Plan.", "ch": ["True", "False"], "a": 0, "ex": "Affiant shall not be the same supervisor who initials approval. Separate Tactical Plan per location.", "src": "Manual 4/742", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "fog", "q": "ICS transfer of command must include a briefing that captures essential information for continuing safe and effective operations.", "ch": ["True", "False"], "a": 0, "ex": "Establishment and Transfer of Command is an essential ICS feature.", "src": "EOG Vol. 4 — ICS feature 9", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Unity of command means every individual at the incident has:", "ch": ["Two bosses if Unified Command exists", "One designated supervisor", "No supervisor in the hot zone", "Only radio contact with DOC"], "a": 1, "ex": "One supervisor. Chain of command is the orderly line of authority.", "src": "EOG Vol. 4 — ICS feature 10", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "Unified Command is used when multiple jurisdictions or agencies have significant authority so they can work together without losing individual agency authority.", "ch": ["True", "False"], "a": 0, "ex": "EOG Vol. 4.", "src": "EOG Vol. 4 — ICS feature 11", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "so", "q": "SO3 03-09-22 limits pretextual stops. A stop justified only as a fishing expedition for an unrelated hunch is:", "ch": ["Always lawful if the tint is dark", "In tension with current Department pretext policy", "Required by CompStat", "The same as a probation search"], "a": 1, "ex": "Use current Manual / SO3 03-09-22 wording on the exam.", "src": "SO3 03-09-22 — 2026 bibliography", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "man", "q": "The Department motto is:", "ch": ["To Serve and Protect", "To Protect and To Serve", "Integrity First", "Service Before Self"], "a": 1, "ex": "Manual 1/100.", "src": "Manual 1/100 — Q1 2026 Department Manual Vol. 1", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The Department Vision is to, as closely as possible, achieve:", "ch": ["Zero uses of force", "A City free from crime and public disorder", "The highest arrest rate in the nation", "Full staffing on every watch"], "a": 1, "ex": "Manual 1/102.", "src": "Manual 1/102 — Q1 2026 Department Manual Vol. 1", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "How many Core Values are listed in Manual Volume 1?", "ch": ["Four", "Five", "Six", "Eight"], "a": 2, "ex": "Six Core Values.", "src": "Manual 1/110 — Q1 2026 Department Manual Vol. 1", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "pj", "q": "Which is a Department Core Value?", "ch": ["CompStat first", "Service to our communities", "Maximum arrests", "Zero discretion"], "a": 1, "ex": "1/110.10 Service to Our Communities.", "src": "Manual 1/110 — Q1 2026 Department Manual Vol. 1", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Policy differs from procedure in that policy:", "ch": ["Lists every step for a specific task", "Establishes limits of action; procedure directs response within those limits", "Is a specific prohibition with no exceptions", "Is only for the Chief"], "a": 1, "ex": "Manual 1/020.40.", "src": "Manual 1/020.40 — Q1 2026 Department Manual Vol. 1", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_1_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "uof", "q": "SB 230 required the Department to revise its use-of-force policy, including de-escalation when feasible and proportional force. That revision lives in:", "ch": ["Manual 3/810", "Manual 1/556.10", "Manual 4/120", "SO5 2012 only"], "a": 1, "ex": "Policy on Use of Force — 1/556.10.", "src": "Manual 1/556.10 / SB 230 page — Q1 2026 Vol. 1", "url": "https://www.lapdonline.org/police-commission/sb230-revised-policy/"}, {"topic": "pj", "q": "Discriminatory conduct based on actual or perceived race, religion, color, ethnicity, national origin, age, gender, gender identity or expression, sexual orientation, disability, immigration or employment status, English fluency, or homeless circumstance is:", "ch": ["Discouraged", "Prohibited while performing any law enforcement activity", "Allowed during gang investigations", "A training issue only"], "a": 1, "ex": "Manual 1/345. Failure to comply is serious misconduct.", "src": "Manual 1/345 — biased policing policy", "url": "https://www.lapdonline.org/community-inquiries-on-lapd-training-and-practice/"}, {"topic": "pobor", "q": "Government Code 3303 generally applies to interrogations that could lead to punitive action. The officer must normally be informed of the nature of the investigation prior to interrogation.", "ch": ["True", "False"], "a": 0, "ex": "Read the current text of 3303; there are listed exceptions.", "src": "Gov. Code § 3303 — POBOR", "url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=3303."}, {"topic": "man", "q": "Complaints shall be accepted from any source, including anonymous, third person, written, verbal, electronic, or TTY, at PAB, any Area, BOPC, or OIG.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/810.05.", "src": "Manual 3/810.05 — Q1 2026 Department Manual Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Only supervisors shall initiate Complaint Forms.", "ch": ["True", "False"], "a": 0, "ex": "Note under complaints other than in-person.", "src": "Manual 3/811.25 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The watch commander who becomes aware of a complaint shall ensure a Complaint Form is prepared without unnecessary delay and shall review completeness, classify Disciplinary vs Non-Disciplinary, facilitate ACR when appropriate, then sign and send to the CO.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/811.05.", "src": "Manual 3/811.05 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "IAG has no review responsibility for Non-Disciplinary complaints after the CF number is issued.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/818 Note.", "src": "Manual 3/818 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Disciplinary allegations shall be dispositioned using Unfounded, Exonerated, Not Resolved, Sustained, Sustained-No Penalty, Insufficient Evidence to Adjudicate, Withdrawn by the COP (IAG only), or Duplicate.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/820.25.", "src": "Manual 3/820.25 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "As a general rule, the commanding officer who managed the employee at the time of the occurrence shall adjudicate the complaint.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/825.", "src": "Manual 3/825 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Non-Disciplinary complaints do not require a Letter of Transmittal.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/831.10.", "src": "Manual 3/831.10 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Only sustained Department complaints (or public complaints with a mix of Sustained and Not Resolved) are filed in the employee’s personnel file. Other-than-sustained stay in IAG files.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/833.", "src": "Manual 3/833 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "When a complaint is related to a Non-Categorical use of force, the investigating supervisor notifies the WC/OIC immediately. Differing versions of events do not by themselves equal an allegation of misconduct for assigning the preliminary investigation.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/830.10.", "src": "Manual 3/830.10 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "If an employee refuses a chemical test in an administrative investigation, the order to submit for administrative purposes only is given by the first available officer of appropriate rank in this sequence: OIC or WC; employee’s CO; IAG investigator regardless of rank; other officer of appropriate rank.", "ch": ["True", "False"], "a": 0, "ex": "Form 01.28.08 Chemical Test Administrative Advisement.", "src": "Manual 3/836 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "A Department employee detained or arrested (inside or outside the City, excluding traffic infractions) shall advise the detaining officer of Department status and notify his/her WC, or RACR if the assignment is closed.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/837.10.", "src": "Manual 3/837.10 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "When an employee is detained inside the City, the WC/supervisor shall notify the employee’s WC or RACR, notify IAG (or RACR for on-call IAG), respond and do a preliminary investigation, and prepare a 1.28.", "ch": ["True", "False"], "a": 0, "ex": "Traffic-related in-City collisions/assaults with a vehicle go to the traffic division WC, bureau of occurrence.", "src": "Manual 3/837.10 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Approval for a strip or involuntary clothing search in an administrative investigation requires a commander or above in the chain of command AND a captain or civilian CO from the employee’s division/Area at scene (or a staff officer in the chain if the captain is unavailable).", "ch": ["True", "False"], "a": 0, "ex": "Same-sex search, out of public view. Employee may have up to two hours for a representative.", "src": "Manual 3/839.22 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Inactive duty may be ordered by a watch commander when it is contrary to the Department’s best interests for the employee to continue regular duties pending investigation or formal discipline.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/840.10.", "src": "Manual 3/840.10 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "The Chief of Police has authority to seize or return an officer’s firearm. That authority is exercised through the Director, Office of Administrative Services; if unavailable, contact CO Personnel Group.", "ch": ["True", "False"], "a": 0, "ex": "Final authority remains with the COP.", "src": "Manual 3/840.30 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "An employee returning from suspension reports in person to the CO. Written bureau CO approval is required before reissuing City firearms and ammo; the BCO must confer with IAG, BSS, or Legal Affairs as applicable.", "ch": ["True", "False"], "a": 0, "ex": "Manual 3/860.30.", "src": "Manual 3/860.30 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "man", "q": "Upon notification of a retaliation complaint, the supervisor shall meet the complainant and the accused, explain the process, warn against retaliation, watch the workplace, and immediately initiate a complaint for retaliatory acts.", "ch": ["True", "False"], "a": 0, "ex": "Supervisors are evaluated on the response, similar to CUOF response.", "src": "Manual 3/890 — Q1 2026 Vol. 3", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_3_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "When reviewing IRs, arrest reports, or any crime reports, watch commanders shall ensure officers documented whether a Marsy’s Rights Card was provided.", "ch": ["True", "False"], "a": 0, "ex": "If not provided, the WC ensures one is provided, mailed, emailed, or faxed.", "src": "Manual 4/203.34 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Officers shall issue a DVV pamphlet to victims of violent crimes and all victims of domestic violence. WC checks the narrative or checkbox on review.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/203.36.", "src": "Manual 4/203.36 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "The senior officer at scene shall immediately notify the Area WC of a homicide or suspected homicide, a crime of violence likely to cause death, extortion or threat, kidnapping, major press potential, a citywide-problem crime, or information needing immediate follow-up.", "ch": ["True", "False"], "a": 0, "ex": "WC then notifies RHD for kidnapping with SBI/death potential, Area detectives, the responsible investigative CO, or DSVD when closed.", "src": "Manual 4/201 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "When a parolee is booked on a felony, the WC approving booking promptly notifies the parole officer or parole agency.", "ch": ["True", "False"], "a": 0, "ex": "CYA notification only when a hold is requested.", "src": "Manual 4/201.37 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "An FI shall be completed for all arrested persons except plain drunk, begging, or a misdemeanor traffic warrant, unless other criminal activity is indicated.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/202.01.", "src": "Manual 4/202.01 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "When a minor is taken into temporary custody for 601/602 WIC and the officer does not intend to interrogate, the officer provides the 625 advisement, does not seek a waiver, and does not ask if the minor understands.", "ch": ["True", "False"], "a": 0, "ex": "Gladys R. questionnaire after Miranda and before questioning if the minor is under 14 and will be interrogated.", "src": "Manual 4/202.30 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "A juvenile escapee is booked and detained as advised by the Watch Commander, DSVD, after telephone notification.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/670.10.", "src": "Manual 4/670.10 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "When it is learned a person under 18 was booked as an adult and no adult complaint issued, the WC causes segregation, notifies the I/O, obtains a new booking number, and rebooks as a juvenile.", "ch": ["True", "False"], "a": 0, "ex": "Misrepresentation of age that delayed the investigation can add up to 48 hours after true age is known.", "src": "Manual 4/705.62 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "A progress report on an unsolved homicide is due from detectives to their CO within:", "ch": ["30 days", "60 days", "120 days of case assignment", "One year"], "a": 2, "ex": "120 days.", "src": "Manual Vol. 4 — unsolved homicides", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Telephonic homicide notification by the homicide I/O goes to the concerned operations bureau office and the Administrative Unit, DSVD, as soon as practical after the preliminary investigation.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/710.10.", "src": "Manual 4/710.10 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Before taking a missing-adult report, the interviewing officer attempts to locate the person by calling MPU/DSVD, MEU, LAC+USC, records for traffic collisions, IRC, and the Coroner.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/712.05.", "src": "Manual 4/712.05 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Gang History Books shall not be removed from the Area station without prior approval from the Area Commanding Officer. The WC shall have access to all gang files including those books.", "ch": ["True", "False"], "a": 0, "ex": "Only authorized gang investigation units maintain the books.", "src": "Manual 4/721.15 Note", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Arrest narratives are not required for felony warrant arrests except parole/probation holds, UOF, recovered evidence, injuries that could be attributed to officers, aggravated/unusual circumstances, or WC direction.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/725.48.", "src": "Manual 4/725.48 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "The Warrant Review Officer shall be Sergeant I, Detective II, or higher and conducts the final quality-assurance review of search and arrest warrants.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/742.", "src": "Manual 4/742 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "ops", "q": "Approval to search a news-media facility is requested on a 15.2 through the chain to the Chief of Police. After hours, emergency requests go through the DSVD WC with bureau staff-officer approval.", "ch": ["True", "False"], "a": 0, "ex": "Manual 4/742.50.", "src": "Manual 4/742.50 — Q1 2026 Vol. 4", "url": "https://lapdonlinestrgeacc.blob.core.usgovcloudapi.net/lapdonlinemedia/VOLUME_4_Q1_2026_Updates_from_1_1_26_to_3_31_26_.pdf"}, {"topic": "fog", "q": "Eight qualities of effective Incident Commanders include command presence, ICS understanding, proven management, strong decision-making, calm quick thinking, good communication, adaptability, recognizing limitations, and political awareness.", "ch": ["True", "False"], "a": 0, "ex": "Command presence is not the same as rank.", "src": "EOG Vol. 4 Command Officer’s Guide — 2026 LT bibliography", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "fog", "q": "ICS accountability includes check-in, operations directed by the IAP, unity of command, personal responsibility, span of control, and resource tracking.", "ch": ["True", "False"], "a": 0, "ex": "Essential ICS feature 12.", "src": "EOG Vol. 4 — ICS Accountability", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "fog", "q": "Personnel and equipment should respond only when requested or dispatched by an appropriate authority.", "ch": ["True", "False"], "a": 0, "ex": "ICS Dispatch/Deployment.", "src": "EOG Vol. 4 — ICS feature 13", "url": "https://training.fema.gov/is/courseoverview.aspx?code=IS-100.c&lang=en"}, {"topic": "so", "q": "The official 2026 Lieutenant bibliography is published by the City Personnel Department. Questions (except some crime-math items) come from that list.", "ch": ["True", "False"], "a": 0, "ex": "Bookmark the live bibliography; Q1 2026 Manual supersedes conflicting older SOs/AOs.", "src": "2026 Police Lieutenant Bibliography — Personnel Department", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "so", "q": "If a Special Order or Administrative Order conflicts with the Department Manual Quarter 1, 2026 text, the exam source note says the Q1 2026 Manual supersedes.", "ch": ["True", "False"], "a": 0, "ex": "Read the current Manual first, then the SO for history.", "src": "2026 Lt Bibliography cover note", "url": "https://personnel.lacity.gov/doc.cfm?get=2232Biblio"}, {"topic": "so", "q": "2026 OCOP Administrative Orders and related directives are posted on the OCOP 2026 Docs page.", "ch": ["True", "False"], "a": 0, "ex": const state={view:"home",deck:[],i:0,score:0,answered:false,picked:null,left:20,timer:null,listening:false,_afterSpeak:null,exam:true};
function qid(item){return String(item.q||"").slice(0,120);}
function loadS(){try{return JSON.parse(localStorage.getItem("ltdrill-v2")||"{}")}catch(e){return {}}}
function saveS(s){try{localStorage.setItem("ltdrill-v2",JSON.stringify(s))}catch(e){}}
function stats(){
  const s=loadS();
  s.right=s.right||{}; s.wrong=s.wrong||{}; s.topic=s.topic||{}; s.history=s.history||[];
  return s;
}
function record(item,ok){
  const s=stats(); const id=qid(item);
  if(!s.topic[item.topic]) s.topic[item.topic]={r:0,w:0};
  if(ok){s.right[id]=(s.right[id]||0)+1; delete s.wrong[id]; s.topic[item.topic].r++;}
  else {s.wrong[id]=(s.wrong[id]||0)+1; s.topic[item.topic].w++;}
  saveS(s);
}
function srsMap(){const s=stats(); s.srs=s.srs||{}; return s;}
function schedule(item,grade){
  const s=srsMap(); const id=qid(item);
  let c=s.srs[id]||{box:1,due:0,reps:0};
  if(grade===0){c.box=1; c.due=Date.now();}
  else if(grade===1){c.box=Math.max(1,c.box); c.due=Date.now()+86400000;}
  else {c.box=Math.min(5,(c.box||1)+1); const days=[0,1,3,7,16,30][c.box]||30; c.due=Date.now()+days*86400000;}
  c.reps=(c.reps||0)+1; s.srs[id]=c; saveS(s);
}
function dueItems(){
  const now=Date.now(); const s=srsMap();
  return shuffle(BANK.filter(x=>{

    if(!c) return true;
    return c.due<=now && c.box<5;
  }));
}
function masteredCount(){return Object.values((stats().srs)||{}).filter(c=>c.box>=5).length;}

}
function grade(g){

  schedule(state.deck[state.i],g);

}

function missedItems(){

function weakTopics(){
  const s=stats();
  return Object.entries(s.topic).map(([k,v])=>{
    const n=v.r+v.w; const pct=n?v.r/n:1;

}
function startMissed(){

document.addEventListener("keydown",function(e){
  if(state.view!=="quiz"&&state.view!=="drive") return;

  else if(k==="b"||k==="2") pick(1);

});
}
function startWeak50(){

  }
  state.deck=shuffle(pool.slice(0,Math.min(80,pool.length))).slice(0,50);
  state.i=0;state.score=0;state.answered=false;state.picked=null;state.view="quiz";render();
}
function acc(){
  const s=stats();
  let r=0,w=0;
  Object.values(s.topic).forEach(v=>{r+=v.r;w+=v.w});
  const n=r+w; return {r,w,n,pct:n?Math.round(100*r/n):0,miss:Object.keys(s.wrong).length};
}


function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function $(s){return document.querySelector(s)}
function backBtn(label){return '<button class="btn sec" type="button" onclick="goBack()" style="min-width:72px">← '+(label||'Back')+'</button>'}
function goBack(){
  if((state.view==="quiz"||state.view==="drive") && state.i>0){
    state.i--; state.answered=false; state.picked=null;
    if(state.view==="drive"){ try{beginClock()}catch(e){} render(); try{setTimeout(driveAsk,200)}catch(e){} }
    else render();
    return;
  }
  go("home");
}
function topicName(k){return (TOPICS.find(t=>t[0]===k)||[k,k])[1]}
function cap(){return (window.Capacitor && Capacitor.Plugins) ? Capacitor.Plugins : {};}

async function speak(text, after){
  state._afterSpeak=after||null;
  const t=String(text||"");
  try{
    if(window.AndroidBridge && AndroidBridge.speak){ AndroidBridge.speak(t); return; }
  }catch(e){}
  try{
    const TTS=cap().TextToSpeech;
    if(TTS && TTS.speak){
      await TTS.speak({text:t, lang:"en-US", rate:0.96, pitch:1.0, category:"playback"});
      finishSpeak(); return;
    }
  }catch(e){}
  if(window.speechSynthesis){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.rate=0.96; u.lang="en-US";
    u.onend=finishSpeak; u.onerror=finishSpeak;
    speechSynthesis.speak(u); return;
  }
  finishSpeak();
}
function finishSpeak(){
  const f=state._afterSpeak; state._afterSpeak=null; if(f) f();
}
function onAndroidSpeakEnd(){ finishSpeak(); }
function stopSpeak(){
  try{ if(window.AndroidBridge && AndroidBridge.stop) AndroidBridge.stop(); }catch(e){}
  try{ const TTS=cap().TextToSpeech; if(TTS && TTS.stop) TTS.stop(); }catch(e){}
  if(window.speechSynthesis) speechSynthesis.cancel();
}

function parseChoice(text){
  const raw=(text||"").toLowerCase();
  const t=" "+raw.replace(/[^a-z0-9 ]/g," ")+" ";
  if(/\b(repeat|again|say that|what)\b/.test(t)) return "repeat";
  if(/\b(stop|end|quit|home|cancel)\b/.test(t)) return "stop";
  if(/\b(skip|next)\b/.test(t)) return "next";
  if(/\b(alpha|option a|answer a|letter a|\ba\b)\b/.test(t) || raw.trim()==="a") return 0;
  if(/\b(bravo|option b|answer b|letter b|\bb\b)\b/.test(t) || raw.trim()==="b") return 1;
  if(/\b(charlie|option c|answer c|letter c|\bc\b)\b/.test(t) || raw.trim()==="c") return 2;
  if(/\b(delta|option d|answer d|letter d|\bd\b)\b/.test(t) || raw.trim()==="d") return 3;
  return null;
}

async function listenOnce(){
  if(state.view!=="drive" || state.answered) return;
  state.listening=true; const pill=$("#timer"); if(pill) pill.textContent="Listening";
  try{
    if(window.AndroidBridge && AndroidBridge.listen){ AndroidBridge.listen(); return; }
  }catch(e){}
  try{
    const SR=cap().SpeechRecognition;
    if(SR){
      if(SR.requestPermissions) await SR.requestPermissions();
      if(SR.start){
        const res=await SR.start({language:"en-US", maxResults:3, prompt:"Say A, B, C, D, or repeat", partialResults:false, popup:false});
        const said=(res && (res.matches && res.matches[0] || res.value)) || "";
        onHeard(said); return;
      }
    }
  }catch(e){}
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){ state.listening=false; return; }
  try{
    const r=new Rec(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
    r.onresult=function(ev){ onHeard(ev.results[0][0].transcript); };
    r.onerror=function(){ state.listening=false; if(state.view==="drive"&&!state.answered) setTimeout(listenOnce,600); };
    r.onend=function(){ state.listening=false; };
    r.start();
  }catch(e){ state.listening=false; }
}
function onAndroidHeard(text){ onHeard(text||""); }
function onHeard(said){
  state.listening=false;
  if(state.view!=="drive") return;
  const cmd=parseChoice(said);
  if(cmd==="repeat"){ driveAsk(); return; }
  if(cmd==="stop"){ stopSpeak(); go("home"); return; }
  if(cmd==="next"){ next(); return; }
  if(typeof cmd==="number"){ pick(cmd); return; }
  if(!state.answered) setTimeout(listenOnce,500);
}
function driveAsk(){
  const item=state.deck[state.i]; if(!item) return;
  const letters=item.ch.map((c,idx)=>String.fromCharCode(65+idx)+". "+c).join(". ");
  const text="Question "+(state.i+1)+" of "+state.deck.length+". "+item.q+". "+letters+". Answer A, B, C, or D. Say repeat to hear it again.";
  speak(text, function(){ listenOnce(); });
}

function go(v){stopT();stopSpeak();state.view=v;state.answered=false;state.listening=false;render()}

function sourcesView(){
  const rows=[
    ["2026 Lt bibliography (Personnel)",LINKS.biblio,"Every listed SO, FOG, EOG, UOF directive, MOU, and legal bulletin starts here."],
    ["Q1 2026 Department Manual hub",LINKS.manual,"Official Volume 0–5 PDFs."],
    ["Volume 1 Policy PDF",LINKS.v1,"Core values, 1/345, 1/556.10."],
    ["Volume 3 Supervision PDF",LINKS.v3,"Complaints, pursuits, fleet, roll call, FID/CUOF admin."],
    ["Volume 4 Line procedures PDF",LINKS.v4,"Codes, notifications, missing persons, warrants."],
    ["OCOP 2026 Docs",LINKS.ocop,"Current Administrative Orders."],
    ["Use of Force / SB 230 page",LINKS.uof,"1/556.10 policy map."],
    ["Gov. Code 3303 (POBOR)",LINKS.pobor,"Interrogation rights statute."]
  ].map(([n,u,p])=>`<a class="card wide" style="margin-bottom:8px;display:block" href="${u}" target="_blank" rel="noopener"><h3>${n}</h3><p>${p}</p></a>`).join("");
  return `<div class="top">${backBtn()}<h1>Sources</h1></div><div class="warnbox">FOG, EOG Vols 2/4/5/6, UOF Directives, Protest Guide, MOU 24, and most SOs are not public HTML. Cards link to the official bibliography. Open your copy for the page. This drill covers SO titles, FOG quiz items, Manual Vol. 3 listed ranges, Vol. 4 line procedures, UOF directive titles, EOG volume IDs, POBOR, and crime math. It does NOT replace reading Legal Bulletins, the Legislative Digest pp. 1–7, Strategic Plan, or DEOP/COOP annex cover-to-cover.</div>`+rows;
}
function resetStats(){if(confirm("Clear missed pile and stats on this device?")){localStorage.removeItem("ltdrill-v2");render();}}
function statsView(){const s=stats();const rows=TOPICS.map(([k,n])=>{const v=s.topic[k]||{r:0,w:0};const tot=v.r+v.w;const pct=tot?Math.round(100*v.r/tot):"—";return `<div class="card wide" style="margin-bottom:8px"><h3>${n}</h3><p>${v.r} right / ${v.w} wrong · ${pct}% · ${tot} answered</p></div>`;}).join("");return `<div class="top">${backBtn()}<h1>Stats</h1></div><div class="statrow"><div class="stat"><b>${acc().pct}%</b><span>all-time</span></div><div class="stat"><b>${acc().miss}</b><span>missed</span></div><div class="stat"><b>${acc().n}</b><span>answered</span></div></div>${rows}<button class="btn sec" onclick="resetStats()">Reset stats on this device</button>`;}
function startQuiz(filter,n){
  let pool=BANK.slice();
  if(filter) pool=pool.filter(x=>x.topic===filter);
  const size=n||50;
  state.deck=shuffle(pool).slice(0,Math.min(size,pool.length));
  state.i=0;state.score=0;state.answered=false;state.picked=null;state.view="quiz";render();
}
function startRandom50(){ startQuiz(null,50); }

function startDrive(n){
  const pool=shuffle(BANK);
  const d=[]; for(let k=0;k<n;k++) d.push(pool[k%pool.length]);
  state.deck=d;state.i=0;state.score=0;state.answered=false;state.picked=null;state.left=20;state.view="drive";render();beginClock();
  setTimeout(driveAsk,300);
}
function stopT(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function beginClock(){
  stopT();state.left=20;
  state.timer=setInterval(()=>{
    if(state.view!=="drive"||state.answered){stopT();return}
    state.left--;
    const el=$("#timer"); if(el && !state.listening) el.textContent=state.left+"s";
    if(state.left<=0){stopT();state.answered=true;speak("Time. The answer is "+String.fromCharCode(65+state.deck[state.i].a)+".");render()}
  },1000);
}
function pick(idx){
  if(state.answered) return;
  const item=state.deck[state.i];
  state.picked=idx;state.answered=true;
  const ok=idx===item.a;
  if(ok) state.score++;
  record(item,ok);
  if(!ok){
    const pos=Math.min(state.deck.length, state.i+3);
    state.deck.splice(pos,0,item);
  }
  stopT();render();
  if(state.view==="drive") speak(ok?"Correct. If you can, say the rule in one sentence.":"Wrong. The answer is "+String.fromCharCode(65+item.a)+". "+(item.ex||""));
}
function next(){
  state.i++;state.answered=false;state.picked=null;state.listening=false;
  if(state.view==="drive"&&state.i<state.deck.length){beginClock();render();setTimeout(driveAsk,300);}
  else render();
}

function home(){
  return `<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="badgeimg" aria-label="LT">LT</div><div><h1>LT Drill</h1><div class="sub">Personal study drill — not an official City key. Verify Q1 2026 Manual before sharing.</div></div></div><div class="pill">${BANK.length} items</div></div>
  <div class="warnbox">Best loop: Due today → miss comes back in 3 cards → After answer tap Again / Hard / Good. Say the Manual section out loud. Not a certified exam key. Desktop keys: A B C D, N next, R repeat. Misses are saved on this device.</div>
  <div class="statrow"><div class="stat"><b>${BANK.length}</b><span>items</span></div><div class="stat"><b>${acc().pct}%</b><span>all-time</span></div><div class="stat"><b>${acc().miss}</b><span>missed pile</span></div><div class="stat"><b>${(typeof dueCount==='function'?dueCount():0)}</b><span>due</span></div><div class="stat"><b>${(typeof masteredCount==='function'?masteredCount():0)}</b><span>box 5</span></div></div>
  <div class="cards">
    <button class="card wide" onclick="startDue()"><h3>Due today</h3><p>Spaced review. New cards plus anything that came due.</p></button>
    <button class="card wide" onclick="startRandom50()"><h3>Random 50 — all sections</h3><p>Mixes every section. Use this to seed new cards.</p></button>
    <button class="card" onclick="startQuiz(null,50)"><h3>Another Random 50</h3><p>New mix of 50.</p></button>
    <button class="card" onclick="startMissed()"><h3>Review misses</h3><p>Only questions you missed on this device.</p></button>
    <button class="card" onclick="startWeak50()"><h3>Weak topics 50</h3><p>Heavier on sections you miss.</p></button>
    <button class="card" onclick="go('stats')"><h3>My stats</h3><p>Accuracy by section.</p></button>
    <button class="card" onclick="startDrive(20)"><h3>Drive 20</h3><p>Voice, mixed bank.</p></button>
    <button class="card" onclick="startDrive(50)"><h3>Drive 50</h3><p>Full mixed voice set.</p></button>
    <button class="card" onclick="go('board')"><h3>Interview</h3><p>Oral-board starters.</p></button>
    <button class="card wide" onclick="startQuiz('so',50)"><h3>Special Orders — 50</h3><p>SO block only.</p></button>
    <button class="card wide" onclick="startQuiz('fog',50)"><h3>FOG — up to 50</h3><p>Unusual occurrence / FOG quiz.</p></button>
    <button class="card wide" onclick="startQuiz('man',50)"><h3>Manual / WC — up to 50</h3><p>Complaints, pursuits, roll call, fleet.</p></button>
    <button class="card wide" onclick="go('sources')"><h3>Official source links</h3><p>Q1 2026 Manual PDFs, bibliography, POBOR, UOF.</p></button>
  </div>`;
}
function topics(){
  return `<div class="top">${backBtn()}<h1>Topics</h1></div>`+TOPICS.map(([k,n])=>{
    const c=BANK.filter(x=>x.topic===k).length;
    return `<button class="card wide" style="margin-bottom:8px" onclick="startQuiz('${k}',50)"><h3>${n}</h3><p>${c} items</p></button>`;
  }).join("");
}
function quizView(drive){
  if(state.i>=state.deck.length){
    const a=acc();
    return `<div class="top">${backBtn("Home")}<h1>Session done</h1></div><div class="statrow"><div class="stat"><b>${state.score}/${state.deck.length}</b><span>${Math.round(100*state.score/Math.max(1,state.deck.length))}%</span></div><div class="stat"><b>${a.miss}</b><span>in missed pile</span></div><div class="stat"><b>${a.pct}%</b><span>all-time</span></div></div>
    <div class="row"><button class="btn" onclick="${drive?'startDrive(50)':'startRandom50()'}">Another 50</button><button class="btn sec" onclick="startMissed()">Restudy misses now</button><button class="btn sec" onclick="go('home')">Home</button></div>`;
  }
  const item=state.deck[state.i];
  const letters=item.ch.map((c,idx)=>{
    let cls="choice";
    if(state.answered && idx===item.a) cls+=" good";
    if(state.answered && idx===state.picked && idx!==item.a) cls+=" bad";
    return `<button class="${cls}" onclick="pick(${idx})">${String.fromCharCode(65+idx)}. ${c}</button>`;
  }).join("");
  return `<div class="top">${backBtn()}<div><h1>${drive?'Drive ':'Q '}${state.i+1}/${state.deck.length}</h1><div class="sub">${topicName(item.topic)}</div></div>
    <div class="pill ${state.listening?'live':''}" id="timer">${drive?(state.listening?'Listening':state.left+'s'):(state.score+' correct')}</div></div>
    <div class="qbox">${item.q}</div>
    ${state.answered?`<div class="ref"><b>Reference:</b> ${item.src||item.ex||''}${item.url?` · <a class="srclink" href="${item.url}" target="_blank" rel="noopener">Open source</a>`:''}</div>`:`<div class="small">Reference hidden until you answer. After you pick, the citation becomes a link.</div>`}
    ${letters}
    ${drive&&!state.answered?`<div class="row"><button class="btn" onclick="driveAsk()">Repeat / listen</button><button class="btn sec" onclick="listenOnce()">Tap to speak</button></div>`:''}
    ${state.answered?`<div class="explain">${item.ex||''}${item.src?'<div class="small">'+item.src+'</div>':''}${item.url?'<div class="small"><a class="srclink" href="'+item.url+'" target="_blank" rel="noopener">Open source material</a></div>':''}<div class="small" style="margin-top:8px">How well did that stick? Again = see it in a few questions. Good = 3+ days.</div>
    <div class="row">
      <button class="btn sec" onclick="grade(0)">Again</button>
      <button class="btn sec" onclick="grade(1)">Hard</button>
      <button class="btn" onclick="grade(2)">Good</button>
    </div>
    <button class="btn sec" style="width:100%;margin-top:8px" onclick="next()">Skip schedule / Next</button></div>`:''}`;
}
function board(){
  return `<div class="top">${backBtn()}<h1>Interview</h1></div><div class="warnbox">Interview is 100% of the score. Essay is advisory and goes to the board.</div>`+
    ORAL.map(s=>`<div class="card wide" style="margin-bottom:8px"><p>${s}</p></div>`).join("");
}
function render(){
  try{
    const map={home,topics,quiz:()=>quizView(false),drive:()=>quizView(true),board,stats:statsView,sources:sourcesView};
    const html=(map[state.view]||home)();
    const el=$("#app");
    if(!el){document.body.insertAdjacentHTML("afterbegin", html); return;}
    el.innerHTML=html;
    document.querySelectorAll(".nav button").forEach(b=>{
      const cur=state.view==="quiz"?"topics":state.view;
      b.classList.toggle("on", b.dataset.go===cur || (state.view==="home"&&b.dataset.go==="home"));
    });
  }catch(err){
    const el=$("#app");
    const msg=String(err && err.stack || err);
    if(el) el.innerHTML='<div class="warnbox"><b>Screen error</b><br>'+msg.replace(/[<>]/g,"")+"</div>";
  }
}
document.querySelector(".nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go==="drive") startDrive(20);
  else if(b.dataset.go==="topics") go("topics");
  else if(b.dataset.go==="board") go("board");
  else go("home");
});
window.onerror=function(m){const el=$("#app"); if(el) el.insertAdjacentHTML("afterbegin",'<div class="warnbox">'+m+"</div>");};
render();

</script></body></html>
